[project]
name = "infrahub-demo-otn"
version = "0.1.0"
description = "Optical transport network demo for Infrahub"
readme = "README.md"
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.15"
dependencies = [
    "infrahub-sdk[all,ctl]==1.23.1",
    "invoke>=2.2.1,<4.0.0",
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "infrahub-testcontainers==1.11.0",
    "mypy>=1.19.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    "rumdl>=0.1.20",
    "types-pyyaml>=6.0.12",
    "yamllint>=1.37.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrahub_demo_otn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/unit must never need Docker. It is the layer that runs on every change
# and catches a design-claim regression in under a second, so `pytest tests/unit`
# must not so much as import the testcontainers plugin. CI selects the
# integration layer explicitly by path.
markers = ["integration: needs a live Infrahub via infrahub-testcontainers"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# Ruff reads .gitignore, which now covers .claude/, .specify/, .agents/ and
# specs/. Naming them here as well was checked and is redundant, so they are
# gone. docs/ is tracked and holds no Python of ours.
exclude = [".venv/", "docs/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# src/infrahub_demo_otn/basemap.py is generated by scripts/extract_basemap.mjs
# and holds 5,617 coordinate pairs packed one ring to a line. The formatter
# would put every pair on its own line, turn 89 KB into 5,600 lines and roughly
# double the file, and the next run of the script would undo it. Only the
# formatter is switched off here: `ruff check` and mypy still read the file.
exclude = ["src/infrahub_demo_otn/basemap.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
# .remote/ is the export `invoke load-repository` writes for the containers to
# clone. It is a second copy of this repository, so leaving it in means every
# module is analysed twice under two names.
exclude = ["docs/", ".claude/", ".specify/", ".agents/", ".remote/"]
# tests/unit and tests/integration each have a conftest.py, and two modules
# called "conftest" is something mypy refuses to analyse without a package base
# to disambiguate them. `tests/`, `tests/unit/` and `tests/integration/` are
# real packages, each with an __init__.py, so the names resolve as
# tests.unit.conftest and tests.integration.conftest. The two flags below stay
# because they also give scripts/ and the repository root a stable base.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.rumdl]
line-length = 120
respect_gitignore = true
# MD025/MD041: Docusaurus pages carry a frontmatter title AND an H1. That is
# the house convention, not a defect.
# MD033/MD036: MDX is JSX, inline HTML is expected.
# MD029: ordered-list numbering style, noisy and not worth the churn.
disable = ["MD025", "MD029", "MD033", "MD036", "MD041"]
# respect_gitignore above already covers .claude/, .specify/, .agents/, specs/,
# the caches, .venv/ and everything generated under docs/. What is left is what
# .gitignore does not name.
exclude = [".git/", "node_modules/"]

[tool.rumdl.MD013]
code_blocks = false
tables = false
