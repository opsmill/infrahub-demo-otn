---
# Six line ports, two per wavelength. Three of them are shipped ports restated
# with the wavelength they now hold, which the loader applies as an update, and
# three are on the shelves above.
#
# The edge is written from the port side here and from the carrier side under
# `objects/`, which is a load-order difference and not a modelling one:
# `14_geant_ports.yml` loads before `17_geant_carriers.yml`, so a shipped port
# cannot name a wavelength that does not exist yet. In this file the carriers are
# declared at the top, so it can.
#
# `xpdr-lon-01`'s receiver monitor still reports darkness after L1 takes a
# wavelength, and that is left alone. A reading is dated and the wavelength was
# designed onto this branch after it was taken, which is the same clock argument
# `checks/channel_count_consistency.py` is built on. The drift report shows it
# and nothing gates on it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnLinePort
  data:
    - name: L1
      device: xpdr-lon-01
      role: line
      oper_state: up
      tx_power_mdbm: 1000
      rx_sensitivity_mdbm: -18000
      connector_type: LC
      connected_to:
        - roadm-lon-01
        - AD-01
      center_frequency_mhz: 196000000
      carrier: oc-ch094-lon-mil
    - name: L1
      device: xpdr-mil-20
      role: line
      oper_state: up
      tx_power_mdbm: 1000
      rx_sensitivity_mdbm: -18000
      connector_type: LC
      connected_to:
        - roadm-mil-01
        - AD-39
      center_frequency_mhz: 196000000
      carrier: oc-ch094-lon-mil
    - name: L2
      device: xpdr-fra-13
      role: line
      oper_state: up
      tx_power_mdbm: 1000
      rx_sensitivity_mdbm: -18000
      connector_type: LC
      connected_to:
        - roadm-fra-01
        - AD-26
      center_frequency_mhz: 196050000
      carrier: oc-ch095-fra-mil
    - name: L2
      device: xpdr-mil-20
      role: line
      oper_state: up
      tx_power_mdbm: 1000
      rx_sensitivity_mdbm: -18000
      connector_type: LC
