---
# The service that provisions on a corridor with no spectrum left. It carries no
# status, so it starts `planned` from the schema default and the generator writes
# what it decided, the same as every other scenario service.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnService
  data:
    - name: svc-fra-mil-transit-100g
      description: Frankfurt to Milan, 100G IP transit onto a corridor with no spectrum left.
      customer: NREN-IT
      rate_gbps: 100
      sla: silver
      service_profile: ip-transit
      # The same four milliseconds the AI service carries, so this service has
      # the same single route and the two outcomes differ only in how many slots
      # the client needs.
      max_latency_ns: 4000000
      endpoint_a: rtr-fra-01
      endpoint_z: rtr-mil-01
      member_of_groups:
        - optical_services

    # The signature on the refusal this file creates. `svc-fra-mil-ai-400g` is
    # defined in `demo/00_services.yml` and provisions there at step 4; it is
    # this file, six scenarios later, that takes the corridor away from it. So
    # the acceptance belongs here, with the cause, and not in the file that
    # merely names the service.
    #
    # It cannot live in `00_services.yml` even if somebody wanted it there. The
    # generator clears `refusal_accepted` on the provisioning path, so a flag set
    # at step 1 is gone by the end of step 4, and in between it would sit on a
    # `planned` service with no refusal on it, which
    # `checks/provisionable.py` reports as an error in its own right. Set here it
    # lands seconds before the generator refuses the service, and the generator
    # never clears acceptance while a service stays refused.
    #
    # `refusal_accepted` is the one field a person sets and the generator does
    # not. On a scenario file the person is the scenario's author, saying that
    # "no slots on this corridor" is the answer the file was written to get.
    #
    # **The whole definition is restated and it has to be.** This block is an
    # update, matched on `name__value`, which is `OtnService`'s human friendly
    # id, and the object loader still requires every mandatory attribute and
    # relationship on it: `infrahubctl object load` rejects a name-and-flag entry
    # with "customer is mandatory". The other fields are restated with it so no
    # optional value is left to the loader's discretion. `max_latency_ns` is the
    # one that matters most: those four milliseconds are what rule out the Geneva
    # detour and leave this corridor as the only route the service has. Lose it
    # and the service provisions and the scenario says nothing.
    #
    # **Keep these nine lines equal to the ones in `demo/00_services.yml`.**
    # `tests/unit/test_demo_scenarios.py` fails if they drift.
    - name: svc-fra-mil-ai-400g
      description: Frankfurt to Milan, 400G distributed training interconnect.
      customer: EuroHPC-Leonardo
      rate_gbps: 400
      sla: gold
      service_profile: ai-training-dci
      max_latency_ns: 4000000
      endpoint_a: rtr-fra-01
      endpoint_z: rtr-leonardo-mil-01
      refusal_accepted: true
      member_of_groups:
        - optical_services
