---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/object/latest.json
#
# Scenario input: a pluggable optic recorded in an amplifier port.
#
# **What this demonstrates.** `ZRP-BRU-01` is the OpenZR+ module in the Brussels
# router's line port. This file moves it into `amp-ams-bru-08 OUT`, the booster
# port at the Brussels end of the same section, which is a fixed optical
# interface on an EDFA with no cage to take a module.
#
# **The load is expected to succeed, and that is the point.** `OtnTransceiver`
# reaches its port through a relationship peering the `OtnOpticalPort` generic,
# and a relationship to a generic cannot be filtered by peer kind, so the port
# kind is the one rule this check is left holding. A second module in one port is
# refused by the server, as `checks/transceiver_placement.py` records.
#
# The check **fails**, with exactly one finding:
#
#     QDD-400G-ZRP ZRP-BRU-01 is fitted in amp-ams-bru-08 OUT, a port of kind
#     OtnAmplifierPort. A pluggable optic goes in a line, a client or a router
#     port, and no other port kind has a cage to take one, so either this unit
#     is somewhere else or the port on its record is wrong
#
# and the same run states what it judged:
#
#     9 transceiver(s) examined, 6 of them fitted in a port and judged, 3 on a
#     shelf and not judged. An unfitted unit is a spare, an RMA or a
#     decommissioned module, and holding one is why the port relationship is
#     optional. Two modules in one port is not judged here: the schema refuses
#     that write
#
# A second check speaks on this branch. Pulling `ZRP-BRU-01` out of
# `rtr-bru-01 1/2/1` leaves `oc-ch003-ams-bru` with a pluggable at Amsterdam and
# nothing at Brussels, so `transceiver_mode_support` reports the mixed
# termination as INFO and blocks nothing. That row exists in no other state of
# the data: the three router wavelengths ship with both ends fitted and the forty
# transponder wavelengths with neither.
#
# The record is restated whole rather than patched, so the only difference from
# `objects/14a_geant_transceivers.yml` is the port. An object load cannot clear a
# relationship either: `port: null` is refused by the loader with "doesn't have
# the right format one / NoneType", so a module leaves a cage by naming a
# different port and never by naming none.
#
# Not in `objects/`: that tree is generated and a hand edit there fails on the
# next run. It would also put the finding on the default branch, where nobody
# would ever see the check go green.
#
# Loaded onto its own branch by `uv run invoke demo-transceiver-placement`;
# `demo/` is not listed under `objects:` in `.infrahub.yml`.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnTransceiver
  data:
    - serial: ZRP-BRU-01
      status: in_service
      type: QDD-400G-ZRP
      # The reference names its kind because `port` peers `OtnOpticalPort`, and
      # that generic carries no identity keys: they live on `OtnGenericPort`, a
      # sibling generic rather than a parent.
      port:
        kind: OtnAmplifierPort
        data:
          device: amp-ams-bru-08
          name: OUT
