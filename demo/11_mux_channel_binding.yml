---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/object/latest.json
#
# Scenario input: two multiplexer client ports that name the wrong number of
# channels.
#
# **What this demonstrates.** `OtnMuxClientPort` reaches a channel through two
# optional relationships, `dwdm_channel` to the dense grid and `cwdm_channel` to
# the coarse plan, and the schema cannot say "exactly one of these two". The two
# plans are separate kinds and Infrahub has no cross-relationship constraint, so
# the schema can make one relationship mandatory or leave both optional. Both
# records below load, and the load succeeding is the point.
#
# `CH094` on `mux-fra-01` binds nothing. Frankfurt lights 25 dense channels and
# 94 is not one of them, so this is the port an engineer racked ahead of the
# patch and never came back to.
#
# `CH1531-2` on `mux-ams-02` binds both. It names dense channel 94 and the
# coarse 1531 nm the device already lights, which is the mistake a coarse filter
# invites: 1531 is the one wavelength of the four inside the erbium window, and
# a dense channel patched onto its slot looks plausible until something reads
# the two bindings together. The coarse half names a wavelength the device does
# list, so the finding is the double binding alone and not a second complaint
# about an unlisted wavelength.
#
# `checks/mux_channel_binding.py` is what notices. On a branch holding this file
# it fails with exactly two findings, one per port, and the same run states what
# it counted: 16 multiplexers examined, 90 client ports judged, 16 line ports
# skipped, and 14 devices whose dense bindings are compared against nothing
# because the graph holds no dense equivalent of `cwdm_channels`.
#
# Neither port is in `objects/`. `objects/1*.yml` is generated,
# `tests/unit/test_geant_dataset.py` regenerates it and diffs, and a hand-added
# port there fails on the next run. It would also put the finding on the default
# branch, where every branch cut from it would inherit a red check and nobody
# would ever see the check go green.
#
# Loaded onto its own branch by `uv run invoke demo-mux-binding`. `demo/` is not
# listed under `objects:` in `.infrahub.yml`, so git sync never reaches it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnMuxClientPort
  data:
    # Quoted. Both channel kinds are named by a Number human-friendly
    # identifier, and a bare number in YAML is an integer, which the reference
    # resolver rejects.
    - name: CH094
      device: mux-fra-01
      role: client
      oper_state: up
      connector_type: LC
    - name: CH1531-2
      device: mux-ams-02
      role: client
      oper_state: up
      connector_type: LC
      dwdm_channel: "94"
      cwdm_channel: "1531"
