---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/object/latest.json
#
# Scenario input: a variable attenuator dialled past the end of its travel.
#
# **What this demonstrates.** `voa-mil-01` is a 20.0 dB VOA and this file asks it
# for 24.0 dB. Every bound the schema carries is respected: `attenuation_mdb`
# runs from 0 to 30000 millidecibels and 24000 is inside that, so the write is
# accepted and the record reads as ordinary. What it is not inside is this
# device's own `max_attenuation_mdb`, and no schema constraint can say so,
# because that bound is a sibling attribute's value and Infrahub has no
# cross-attribute constraint.
#
# **The load is expected to succeed, and that is the point.** The schema takes
# the half it can and refuses the physically impossible figure. The half left
# over is one comparison between two fields of one node, and that is the whole
# of what `checks/attenuator_range.py` does.
#
# Milan rather than Frankfurt because Milan is the busier add stage: 37 of the
# 40 wavelengths terminate there against 25 at Frankfurt, so it is the VOA an
# operator is most likely to be re-dialling when the number goes past the stop.
#
# The check **fails**, with exactly one finding:
#
#     voa-mil-01 is set to 24.000 dB and can produce 20.000 dB. The device will
#     sit at its stop instead, so the plant delivers 4.000 dB more power than
#     this record says it does and every budget computed from it is optimistic
#     by that much
#
# and the same run states what it judged:
#
#     2 variable attenuator(s) judged against their own maximum, 0 of them
#     dialled to exactly that maximum and passing, because the bound is
#     inclusive. Fixed pads are not judged here and carry no range to judge: the
#     absolute 0 to 30 dB limit is a schema constraint on both kinds and is
#     refused at write time
#
# **The record is restated whole rather than patched.** Every other field is the
# figure `objects/13_geant_devices.yml` already ships, so the only difference
# between this attenuator and the racked one is the setting, and a reader can
# see that without opening the generated file.
#
# Not in `objects/`. `objects/1*.yml` is generated,
# `tests/unit/test_geant_dataset.py` regenerates it and diffs, and a hand edit
# there fails on the next run. It would also put the finding on the default
# branch, where every branch cut from it would inherit a red check and nobody
# would ever see the check go green.
#
# Loaded onto its own branch by `uv run invoke demo-attenuator-range`. `demo/` is
# not listed under `objects:` in `.infrahub.yml`, so git sync never reaches it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnVariableAttenuator
  data:
    - name: voa-mil-01
      role: passive
      site: mil
      insertion_loss_mdb: 1000
      vendor: Generic
      model: V-VOA20
      attenuation_mdb: 24000
      max_attenuation_mdb: 20000
