---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/object/latest.json
#
# GENERATED by scripts/generate_geant_dataset.py. Edit the generator, not this file:
# tests/unit/test_geant_dataset.py regenerates and diffs on every run.
#
# The pluggable optics, one per router line port and three on a shelf.
#
# Numbered to load straight after 14_geant_ports.yml, because a fitted
# unit names the port it sits in and the loader resolves that reference
# at insert time. The reference carries its concrete kind, because the
# port relationship peers a generic that holds no identity keys and a
# bare pair cannot be looked up against it.
#
# A unit with no port is a spare or an RMA. That is why the port
# relationship is optional, and it is why no uniqueness constraint can
# hold one port to one optic: the constraint is available on a mandatory
# relationship only. The duplicate is refused anyway, by the
# cardinality-one inverse the three port kinds that hold a module
# declare. checks/transceiver_placement.py keeps only the port-kind rule.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnTransceiver
  # The part is the same in all six ports: QDD-400G-ZRP lists all three
  # OpenZR+ rungs, so a carrier that later drops to 300G or 200G is
  # still supported by the optic already fitted.
  #
  # The 400ZR spare is the interesting one. Same cage, same
  # constellation, same 400G, and 120 km of cFEC reach against 1000 km
  # of oFEC. Nothing on the outside of the module says which it is.
  data:
    - serial: ZRP-AMS-01
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-ams-01
          name: 1/2/1
    - serial: ZRP-BRU-01
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-bru-01
          name: 1/2/1
    - serial: ZRP-BER-01
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-ber-01
          name: 1/2/1
    - serial: ZRP-PRG-01
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-prg-01
          name: 1/2/1
    - serial: ZRP-HAM-01
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-ham-01
          name: 1/2/1
    - serial: ZRP-BER-02
      status: in_service
      type: QDD-400G-ZRP
      port:
        kind: OtnLinePort
        data:
          device: rtr-ber-01
          name: 1/2/2
    - serial: ZRP-SPARE-01
      type: QDD-400G-ZRP
    - serial: ZRP-RMA-01
      status: rma
      type: QDD-400G-ZRP
    - serial: ZR-SPARE-01
      type: QDD-400G-ZR
