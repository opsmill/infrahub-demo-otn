StylesPath = .vale/styles

MinAlertLevel = warning

[formats]
mdx = md

; Section patterns match the name on disk, so the documentation section has to
; say .mdx. The [formats] mapping above only tells Vale how to parse the file.
; A section written as docs/**/*.md matches nothing and reports nothing.
;
; Vale takes the first section a file matches, so the specific paths come first
; and the catch-all comes last.

[docs/**/*.mdx]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

[README.md]
BasedOnStyles = Infrahub

; An SVG under tests/ is a committed render, not writing. The reference render
; the map's extraction invariant compares against carries the en dash the panel
; table draws between two site codes, so the em-dash rule reports twenty-one
; errors in a file no human wrote a word of. The rule still binds the renderer
; that produced it, which is a .py and matches the section below.
[*.svg]
BasedOnStyles =
Infrahub.em-dash = NO
Infrahub.excluded-vocabulary = NO

; Everything else in the tree is code, YAML or GraphQL. Two rules still apply to
; it, because they are about writing rather than about documentation prose: no
; em dashes, and none of the excluded vocabulary. The rest of the Infrahub style
; would report every Python identifier as a spelling error.
[*]
BasedOnStyles =
Infrahub.em-dash = error
Infrahub.excluded-vocabulary = error
