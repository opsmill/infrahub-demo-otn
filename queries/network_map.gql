# The whole drawable network, once, for the network map transform.
#
# Its own file rather than an extension of `osnr_margin.gql` or
# `budget_report.gql`, for the reason `budget_report.gql` already records: a
# check and a transform have different lifetimes, and a query two artifacts
# share is a query neither can change.
#
# And for the variable. This one is bound to an artifact definition whose
# targets are sites, so it takes `$site`; the other two are unfiltered sweeps,
# and a required variable on either would break the check that runs it.
#
# Everything below `OtnOpticalMultiplexSection` is the shape `plant.py` parses.
query NetworkMap($site: String!) {
  focus_site: OtnSite(shortname__value: $site) {
    edges {
      node {
        id
        __typename
        shortname {
          value
        }
      }
    }
  }
  OtnSite(site_type__value: "pop") {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        shortname {
          value
        }
        site_type {
          value
        }
        latitude_microdeg {
          value
        }
        longitude_microdeg {
          value
        }
        tags {
          edges {
            node {
              name {
                value
              }
              description {
                value
              }
            }
          }
        }
        # Cardinality one, so `node` and never `edges`. Feature 017 measured
        # what the wrong shape costs: the sync fails naming NestedEdgedOtnSite,
        # a type in no schema file and no documentation.
        facility {
          node {
            name {
              value
            }
          }
        }
      }
    }
  }
  OtnOpticalMultiplexSection {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        roadm_a {
          node {
            name {
              value
            }
            insertion_loss_mdb {
              value
            }
            site {
              node {
                shortname {
                  value
                }
              }
            }
          }
        }
        roadm_b {
          node {
            name {
              value
            }
            insertion_loss_mdb {
              value
            }
            site {
              node {
                shortname {
                  value
                }
              }
            }
          }
        }
        spans {
          edges {
            node {
              name {
                value
              }
              oms_sequence {
                value
              }
              length_m {
                value
              }
              splice_count {
                value
              }
              splice_loss_mdb {
                value
              }
              connector_count {
                value
              }
              connector_loss_mdb {
                value
              }
              aging_margin_mdb {
                value
              }
              fiber_type {
                node {
                  name {
                    value
                  }
                  attenuation_mdb_per_km {
                    value
                  }
                  dispersion_fs_per_nm_km {
                    value
                  }
                  group_index_milli {
                    value
                  }
                }
              }
              raman_pumps {
                edges {
                  node {
                    name {
                      value
                    }
                    injection_end {
                      value
                    }
                    propagation {
                      value
                    }
                    on_off_gain_mdb {
                      value
                    }
                    insertion_loss_mdb {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        # Both chains, because a section holds one per direction and the two do
        # not have to agree. A query that selects one and forgets the other
        # reports the missing chain as a section whose amplifiers are not
        # loaded yet.
        amplifiers_a2b {
          edges {
            node {
              name {
                value
              }
              oms_sequence {
                value
              }
              noise_figure_mdb {
                value
              }
              gain_mdb {
                value
              }
            }
          }
        }
        amplifiers_b2a {
          edges {
            node {
              name {
                value
              }
              oms_sequence {
                value
              }
              noise_figure_mdb {
                value
              }
              gain_mdb {
                value
              }
            }
          }
        }
      }
    }
  }
  OtnOpticalCarrier {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        # The anchor and the symbol rate, which are the two selections the
        # occupancy bar needs. The bar draws how much of the C-band a section
        # holds, and a wavelength holds a width rather than a channel number, so
        # the centre frequency places it and the symbol rate sizes it. Counting
        # carriers instead drew a 32 GBd wavelength and a 128 GBd one as the
        # same 1/96th of the band.
        channel {
          node {
            channel_number {
              value
            }
            center_frequency_mhz {
              value
            }
          }
        }
        optical_mode {
          node {
            name {
              value
            }
            baud_mbaud {
              value
            }
            required_osnr_mdb {
              value
            }
            cd_tolerance_fs_per_nm {
              value
            }
            fec_latency_ns {
              value
            }
          }
        }
        sections {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
      }
    }
  }
  OtnOpticalMode {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        mode_class {
          value
        }
        line_rate_gbps {
          value
        }
        baud_mbaud {
          value
        }
        required_osnr_mdb {
          value
        }
        cd_tolerance_fs_per_nm {
          value
        }
        fec_latency_ns {
          value
        }
      }
    }
  }
}
