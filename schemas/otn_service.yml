---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
#
# Customer intent, and the route that answers it.
version: "1.0"

nodes:
  - name: Service
    namespace: Otn
    description: Customer intent. Two endpoints, a rate, a profile and an optional latency budget.
    label: Service
    icon: mdi:file-document-outline
    include_in_menu: false
    # `CoreArtifactTarget` because a service is the target of a generator
    # definition.
    inherit_from:
      - CoreArtifactTarget
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      - name: customer
        kind: Text
        parameters:
          max_length: 64
        optional: false
        description: Who bought it. A Text field, because this model has no organisation kind.
        order_weight: 1200
      # Customer intent, not a modulation format. The generator enumerates every
      # mode whose line rate meets this number; the mode it picks lands on the
      # carrier.
      - name: rate_gbps
        kind: Number
        parameters:
          min_value: 1
          max_value: 1600
        optional: false
        description: Requested client capacity in Gbps. Already whole in its natural unit.
        order_weight: 1300
      - name: sla
        kind: Dropdown
        default_value: silver
        choices:
          - name: gold
            label: Gold
            color: "#ffc107"
          - name: silver
            label: Silver
            color: "#9e9e9e"
          - name: bronze
            label: Bronze
            color: "#795548"
          - name: best_effort
            label: Best effort
            color: "#607d8b"
        optional: false
        order_weight: 1400
      # `rejected` is what the generator writes when it refuses a service.
      # Without it a refusal is indistinguishable from a generator that never
      # ran.
      - name: status
        kind: Dropdown
        default_value: planned
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: provisioning
            label: Provisioning
            color: "#ff9800"
          - name: active
            label: Active
            color: "#4caf50"
          - name: rejected
            label: Rejected
            color: "#f44336"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1500
      # The first three profiles carry a latency budget, the last two leave it
      # null, and the impact report filters on this.
      - name: service_profile
        kind: Dropdown
        default_value: ip-transit
        choices:
          - name: ai-training-dci
            label: AI training DCI
            color: "#e91e63"
          - name: ai-inference
            label: AI inference
            color: "#9c27b0"
          - name: hpc-research
            label: HPC research
            color: "#3f51b5"
          - name: ip-transit
            label: IP transit
            color: "#2196f3"
          - name: legacy-sdh
            label: Legacy SDH
            color: "#795548"
        optional: false
        order_weight: 1600
      - name: max_latency_ns
        kind: Number
        parameters:
          min_value: 0
          max_value: 1000000000
        optional: true
        description: One-way latency budget in nanoseconds. Null on the profiles that have none.
        order_weight: 1700
      - name: max_latency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if max_latency_ns__value is not none %}{{ max_latency_ns__value / 1000 }} us{% endif %}
        optional: true
        description: Latency budget in microseconds. Read-only, derived from max_latency_ns.
        order_weight: 1710
      # The refusal, split in two. It was one Text attribute holding
      # `"{code}: {detail}"`, and the code half was a Python constant that no
      # schema knew about, so a typo in it became a seventh reason nobody read
      # and no write refused it.
      #
      # Six choices, and the colours carry information the old string could not.
      # Grey means the request was unanswerable: no route between the endpoints,
      # or no transponder mode that meets the rate. Red means the physics
      # refused a route that exists: the optical budget or the latency budget.
      # Amber means the network is full: no spectrum on the corridor, or no
      # tributary slots left in the containers. An operator reading a list of
      # refusals learns from the colour alone whether to re-plan, to regenerate
      # or to build.
      #
      # Optional, because a provisioned service carries no refusal. The pairing
      # of a `rejected` status with an empty code is not a state the generator
      # can reach, and `checks/provisionable.py` fails closed on it rather than
      # reporting green for a refusal nobody can read.
      #
      # `tests/unit/test_schema_contract.py` asserts these six names equal the
      # six Python constants. A code added to one and not the other would
      # otherwise fail at write time on a live branch and nowhere earlier.
      - name: rejection_code
        kind: Dropdown
        choices:
          - name: no-route
            label: No route
            description: No path exists between the two endpoints.
            color: "#9e9e9e"
          - name: no-mode
            label: No mode
            description: No transponder mode meets the requested rate.
            color: "#757575"
          - name: budget
            label: Optical budget
            description: A route exists and the OSNR margin is negative on all of them.
            color: "#f44336"
          - name: latency
            label: Latency budget
            description: A route exists and every one of them is slower than the service allows.
            color: "#b71c1c"
          - name: capacity
            label: No spectrum
            description: A route exists and no channel on it is free.
            color: "#ff9800"
          - name: no-slots
            label: No tributary slots
            description: A wavelength was found and its containers have no room for the client.
            color: "#ffb74d"
        optional: true
        description: Why the service was refused, as one of six codes. Empty whenever a path exists.
        order_weight: 1801
      # The prose half of the old string. 512 is what `rejection_reason`
      # carried and what the generator already truncates to, so the cap is
      # unchanged rather than newly imposed.
      - name: rejection_detail
        kind: Text
        parameters:
          max_length: 512
        optional: true
        description: What the refusal looked like in detail. The prose beside the code, never parsed.
        order_weight: 1802
      # Only a person ever sets this to true. It is a signature on a refusal:
      # somebody read the code and the detail, decided the demo wants the
      # refusal recorded rather than fixed, and let the branch merge.
      #
      # `optional: false` with `default_value: false` is what makes it safe to
      # add to a kind that already has rows. Mandatory with no default fails
      # validation against every existing service and blocks the whole schema
      # update; the default lands `false` on all of them, which is the correct
      # reading of every service written before this feature.
      #
      # The generator may only clear it, and only on the path where it
      # provisions the service, because the refusal that was signed for has
      # ceased to exist. While the service remains refused the generator leaves
      # it alone. Both halves matter and the natural mistake is to treat it as a
      # third field beside the code and the detail and clear it on every rerun,
      # which silently un-accepts a decision somebody signed.
      - name: refusal_accepted
        kind: Boolean
        default_value: false
        optional: false
        description: A person read the refusal and accepted it. Only a person sets this.
        order_weight: 1803
    relationships:
      # Peered at the generic, not at OtnRouter, so a service can terminate on a
      # transponder. Both endpoints are one-sided: "which services land on this
      # device" is a native filter on the service side.
      - name: endpoint_a
        peer: OtnGenericDevice
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_service__endpoint_a
        on_delete: no-action
        order_weight: 800
      - name: endpoint_z
        peer: OtnGenericDevice
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_service__endpoint_z
        on_delete: no-action
        order_weight: 810
      # Many, not one, because a circuit regenerated at an intermediate site is
      # one path per wavelength and each path carries its own budget. The order
      # is `segment_sequence` on the path, since an Infrahub relationship hands
      # back a set.
      #
      # The widening is not free. The GraphQL selection shape changes from
      # `optical_path { node { ... } }` to `optical_path { edges { node ... } }`,
      # and every query already selecting it is broken from the moment this
      # loads until it is migrated. Three were: service_trace.gql,
      # service_latency.gql and srlg_exposure.gql. span_impact.gql was NOT,
      # which was measured rather than assumed: it reached optical_path from
      # OtnOpticalCarrier, and feature 016 had already widened that one.
      - name: optical_path
        peer: OtnOpticalPath
        kind: Attribute
        # `schema check` cannot say any of this, because it does not execute a
        # `.gql`. Feature 016 measured the failure this warns about: an
        # unmigrated query fails at repository sync naming `NestedEdged<Kind>`,
        # a type in no schema file and no documentation.
        cardinality: many
        optional: true
        identifier: otn_service__optical_path
        on_delete: no-action
        order_weight: 900
      # Optional: a service that names no client signal is still provisionable
      # from its rate alone.
      #
      # `queries/optical_service.gql` has to select it. A relationship the query
      # does not ask for is a relationship the generator cannot see, and the
      # failure is silent.
      - name: client_signal
        peer: OtnClientSignal
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_service__client_signal
        on_delete: no-action
        order_weight: 910
      # Two services pointing at the same group are declaring that their routes
      # must not share a conduit.
      #
      # A relationship, and this node carried a Text attribute for it first, which
      # is why the point is worth keeping. Two services were in one group only
      # when their strings matched exactly, so `gold-pair` and `gold_pair` were
      # two groups of one and the check passed both in silence. Silence is also
      # what an absent group means, so nothing distinguished "no requirement
      # declared" from "requirement declared and mistyped", and the second is the
      # one that costs a customer a circuit. A regex narrows the ways to typo it
      # and removes none. Feature 016 shipped the same mistake in different
      # clothes, encoding a container's owning service in the container's name.
      #
      # An identifier either resolves to the group object or it fails at write
      # time, so there is no near-miss for the check to pass in silence.
      #
      # Optional, and that is the whole of the design. A service with no group
      # is not checked at all, so an exposure an operator accepted deliberately
      # stays accepted and the check says nothing about it. The check flags a
      # violated declaration, never a shared conduit on its own, which is what
      # answers the objection `transforms/srlg_exposure.py` records about
      # blocking a merge on a decision somebody already made.
      - name: diversity_group
        peer: OtnDiversityGroup
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_diversity_group__services
        # Matching every other cross-reference here. A group and a service are
        # independent objects: deleting the group ends the requirement and must
        # not delete the circuits that carried it.
        on_delete: no-action
        order_weight: 915
      # The client containers this circuit owns. Written from the container side,
      # which is where the comment on `OtnContainer.service` explains why the
      # ownership is stored rather than walked back through the carrier: a carrier
      # holds many optical paths now, so the walk answers with every service on
      # the wavelength.
      #
      # `on_delete: no-action` matches every other container relationship. A
      # deleted service leaves its container behind, inert, the same way a
      # reclaimed carrier leaves its line container behind.
      - name: containers
        peer: OtnContainer
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_service__containers
        on_delete: no-action
        order_weight: 920

  # A node, not a Text attribute and not a Dropdown, and the two rejections have
  # different reasons.
  #
  # Not a Text attribute, because that is a naming convention encoding a link in
  # a string, and the comment on the retired `OtnService.diversity_group`
  # attribute above has the failure it produces.
  #
  # Small on purpose. Everything about which routes are actually disjoint is
  # computed from the spans, so this kind holds the declaration and nothing else.
  - name: DiversityGroup
    namespace: Otn
    # Not a `Dropdown`, because a Dropdown's choices are schema. Adding a group
    # would then be a schema migration, run against loaded data, when what an
    # operator is doing is writing down a promise made to a customer that
    # morning. A node makes that an object write. A Dropdown also has nowhere to
    # put the rest of what a group is: what it is for, who asked for it, what
    # level of diversity was sold. `description` carries that, and a `Dropdown`
    # choice has only a label and a colour.
    description: A declared diversity requirement. The services in one group must route over disjoint conduits.
    label: Diversity group
    icon: mdi:call-split
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      # Unique, because the name is the identity an operator types and the
      # `human_friendly_id` above resolves. Two groups of one name would make
      # the reference ambiguous, which is the failure the Text attribute had.
      #
      # The same length and regex as every other name in this schema. Here the
      # regex is cosmetic rather than load-bearing: a typo now names a group
      # that does not exist and the write fails, instead of silently naming a
      # new group of one.
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      # Why the group exists, in the operator's words. This is the field a
      # string could not have carried, and it is half of why the group is a node.
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
    relationships:
      # The inverse side, sharing one explicit identifier with
      # `OtnService.diversity_group`. Both sides carry it by hand: Infrahub keys
      # a relationship by its identifier rather than by the two peer kinds, the
      # auto-derived form is only safe when both sides' kind-and-peer pairs
      # mirror each other, and it is frozen once loaded. Two diverging
      # identifiers do not error, they split into two one-way edges that read
      # empty from the other side.
      #
      # The check reads the group's services from here, in one selection, which
      # is the other half of why this is a node: the Text attribute forced a
      # scan of every service to reassemble a group by string equality.
      - name: services
        peer: OtnService
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_diversity_group__services
        on_delete: no-action
        order_weight: 800

  - name: OpticalPath
    namespace: Otn
    description: The materialised chosen route for one service, with the budget that chose it.
    label: Optical path
    icon: mdi:map-marker-path
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # No two segments of one circuit carry the same sequence number. The server
    # refuses the second write; nothing has to notice it afterwards.
    #
    # The shape is a relationship plus an attribute of this node, the normal
    # case, which `OtnGenericPort` already uses as `["device", "name__value"]`.
    # What it could not be is `["optical_path", "segment_sequence__value"]` on
    # `OtnService`: the attribute half has to belong to the node the constraint
    # sits on, and `segment_sequence` belongs to the path.
    #
    # It needs `service` to be mandatory, which it now is. The measurement that
    # allowed that is on the `service` relationship below.
    uniqueness_constraints:
      # It does not cover a gap. It refuses a repeat of segment 2 and is blind
      # to the sequence 1, 2, 4, because a schema constrains what is written and
      # cannot notice what is missing. The completeness check owns that ground,
      # and why is in `docs/docs/client-mapping.mdx`.
      - ["service", "segment_sequence__value"]
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # Which segment of its circuit this path is. Mandatory, and unlike
      # OtnAmplifier.oms_sequence it carries a default, because the kinds this
      # feature touches all have live instances and a mandatory attribute with
      # no default fails validation against every one of them and blocks the
      # whole schema update. Not unique on its own: segment 1 exists once per
      # circuit, not once in the network, and the pair with the service is the
      # `uniqueness_constraints` entry above.
      - name: segment_sequence
        kind: Number
        # 1 is not merely a value that loads. It is the correct reading of every
        # path written before this feature: one segment of one. A path that was
        # the whole route is segment 1, and stays it.
        default_value: 1
        parameters:
          min_value: 1
          # A sanity ceiling in the manner of OtnPathHop.sequence, not a derived
          # bound. Tying it to the section or the site count would make the
          # bound wrong the moment the plant grows.
          max_value: 50
        optional: false
        description: Which segment of its circuit this path is. 1 for a circuit that spans one wavelength.
        order_weight: 1200
      # total_length_m, osnr_total_mdb, osnr_margin_mdb and latency_ns were
      # measured over the same enumeration as total_loss_mdb below, and none of
      # them needed moving. The extremes are 3450000 m against a cap of
      # 10000000, OSNR 19045 to 36243 against 0 to 100000, margin -6455 to
      # +16243 against -100000 to +100000, and 16902741 ns against 1000000000.
      - name: total_length_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 10000000
        optional: false
        description: Route length in metres, summed over every span on the path.
        order_weight: 1500
      - name: total_length_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if total_length_m__value is not none %}{{ total_length_m__value / 1000 }} km{% endif %}
        optional: true
        description: Route length in km. Read-only, derived from total_length_m.
        order_weight: 1510
      # 1000000 is 1000 dB, the measured worst case rounded up rather than a
      # guess. The traversal returns routes of at most four sections, and every
      # such route on the shipped plant was budgeted both ways: the largest loss
      # is Madrid to Vienna at 854295, over 3450 km. The old 500000 refused that
      # at write time with "854295 is higher than the maximum allowed value",
      # and it already refused Madrid to Warsaw unregenerated at 737146, the
      # route the regeneration scenario exists to fail. A cap that rejects a
      # route the model is supposed to report as too lossy hides the negative
      # result behind a write error.
      - name: total_loss_mdb
        kind: Number
        parameters:
          min_value: 0
          # A regenerated route is one path per segment, each carrying its own
          # loss, so a cut lowers the figure: Madrid to Warsaw cut at Frankfurt
          # is 462196 and 281950. The bound comes from the unregenerated route,
          # never from a segment.
          max_value: 1000000
        optional: false
        description: End-to-end loss in millidecibels, ageing allowance included.
        order_weight: 1600
      - name: total_loss_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if total_loss_mdb__value is not none %}{{ total_loss_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: End-to-end loss in dB. Read-only, derived from total_loss_mdb.
        order_weight: 1610
      - name: osnr_total_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 100000
        optional: false
        description: OSNR delivered at the receiver in millidecibels, over the amplifier cascade.
        order_weight: 1700
      - name: osnr_total_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if osnr_total_mdb__value is not none %}{{ osnr_total_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Delivered OSNR in dB. Read-only, derived from osnr_total_mdb.
        order_weight: 1710
      - name: osnr_margin_mdb
        kind: Number
        parameters:
          min_value: -100000
          max_value: 100000
        optional: false
        description: Delivered OSNR less the mode requirement and the system margin, in millidecibels.
        order_weight: 1800
      - name: osnr_margin_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if osnr_margin_mdb__value is not none %}{{ osnr_margin_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Signed OSNR margin in dB. Read-only, derived from osnr_margin_mdb.
        order_weight: 1810
      - name: latency_ns
        kind: Number
        parameters:
          min_value: 0
          max_value: 1000000000
        optional: false
        description: One-way latency in nanoseconds. Propagation, node, amplifier and FEC terms.
        order_weight: 1900
      - name: latency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if latency_ns__value is not none %}{{ latency_ns__value / 1000 }} us{% endif %}
        optional: true
        description: One-way latency in microseconds. Read-only, derived from latency_ns.
        order_weight: 1910
    relationships:
      # Mandatory. A path with no service has no meaning in this model: it is
      # one wavelength's route chosen to answer one customer's request, and the
      # figures on it were computed from that request's rate and mode.
      #
      # It was optional, on the stated grounds that a path is written before it
      # is attached and that the generator's refusal path leaves paths behind.
      # Both were measured false. `generators/optical_service.py` passes
      # `"service": str(service["id"])` inside the same `client.create` call
      # that makes the path, so a path never exists unattached even for one
      # round trip, and feature 016 made the refusal path create nothing at all.
      - name: service
        peer: OtnService
        kind: Attribute
        cardinality: one
        # The migration was measured before the change, not reasoned about: 17
        # OtnOpticalPath records across the seven branches on the instance, 0 of
        # them with no service, so nothing exists for a mandatory relationship
        # to fail against. Had any been found, this would have stayed optional
        # and the uniqueness constraint above would not exist. See T009a.
        #
        # It is also what that constraint needs. A constraint naming a
        # relationship is rejected while the relationship is optional, with
        # `cannot use <relationship> relationship, relationship must be
        # mandatory`. So the mandatory flag is not the schema paying for the
        # constraint: the modelling argument stands on its own and the
        # constraint is what it buys.
        optional: false
        identifier: otn_service__optical_path
        on_delete: no-action
        order_weight: 800
      - name: carrier
        peer: OtnOpticalCarrier
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_carrier__optical_path
        on_delete: no-action
        order_weight: 810
      # `on_delete: cascade`, one of the two in the repository. The other is
      # `OtnGenericDevice.ports` in `schemas/otn_base.yml`, and both are the same
      # argument: a hop has no meaning apart from its path, a port has none apart
      # from its device. Here the alternative is twenty-four orphans per deleted
      # path.
      - name: hops
        peer: OtnPathHop
        kind: Component
        cardinality: many
        optional: true
        identifier: otn_path__hops
        on_delete: cascade
        order_weight: 900

  - name: PathHop
    namespace: Otn
    description: One ordered element on a path, carrying the budget's running totals.
    label: Path hop
    icon: mdi:ray-vertex
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - sequence__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 96
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: sequence
        kind: Number
        parameters:
          min_value: 1
          max_value: 1000
        optional: false
        description: Position along the path, counting from the endpoint A ROADM.
        order_weight: 1100
      - name: cumulative_length_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 10000000
        optional: false
        description: Metres travelled at the output of this element.
        order_weight: 1500
      - name: cumulative_length_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if cumulative_length_m__value is not none %}{{ cumulative_length_m__value / 1000 }} km{% endif %}
        optional: true
        description: Kilometres travelled. Read-only, derived from cumulative_length_m.
        order_weight: 1510
      # 1000000, the same cap as OtnOpticalPath.total_loss_mdb, and it has to be
      # the same number rather than merely a large one. This attribute is that
      # one's running total: the last hop's cumulative loss IS the route total,
      # so a hop cap below the path cap refuses a write the path would accept.
      #
      # It was below it. T026c raised the path to 1000000 against a measured
      # worst case of 854295 and left this at 500000, which refused 224 of the
      # 830 route-directions the traversal can build on the shipped plant, over
      # 122 distinct routes. The write failed on the hop rather than on the
      # path, which is the wrong place to read the error and says nothing about
      # the route being too lossy. `cumulative_length_m` and `total_length_m`
      # were already paired at 10000000; only the loss pair had drifted.
      - name: cumulative_loss_mdb
        kind: Number
        parameters:
          min_value: 0
          # tests/unit/test_schema_contract.py asserts the pairing, so the next
          # change to either cap fails rather than diverging in silence.
          max_value: 1000000
        optional: false
        description: Loss accumulated at the output of this element, in millidecibels.
        order_weight: 1600
      - name: cumulative_loss_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if cumulative_loss_mdb__value is not none %}{{ cumulative_loss_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Accumulated loss in dB. Read-only, derived from cumulative_loss_mdb.
        order_weight: 1610
      # Optional because OSNR is undefined until the first amplifier has added
      # noise to measure it against. The engine returns None for those hops.
      - name: cumulative_osnr_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 100000
        optional: true
        description: OSNR after this element, in millidecibels. Empty ahead of the first amplifier.
        order_weight: 1700
      - name: cumulative_osnr_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if cumulative_osnr_mdb__value is not none %}{{ cumulative_osnr_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Accumulated OSNR in dB. Empty ahead of the first amplifier.
        order_weight: 1710
      - name: cumulative_delay_ns
        kind: Number
        parameters:
          min_value: 0
          max_value: 1000000000
        optional: false
        description: One-way delay at the output of this element, in nanoseconds.
        order_weight: 1800
      - name: cumulative_delay_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if cumulative_delay_ns__value is not none %}{{ cumulative_delay_ns__value / 1000 }} us{% endif %}
        optional: true
        description: Accumulated delay in microseconds. Read-only, derived from cumulative_delay_ns.
        order_weight: 1810
    relationships:
      - name: path
        peer: OtnOpticalPath
        kind: Parent
        cardinality: one
        optional: false
        identifier: otn_path__hops
        order_weight: 800
      # One relationship covers ROADMs, amplifiers and fiber spans. There is no
      # ingress or egress port beside it: the loaded plant has no port-level
      # adjacency between a span and the amplifier that feeds it, so both would
      # be null on every span hop and read by nothing.
      - name: element
        peer: OtnOpticalElement
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_hop__element
        on_delete: no-action
        order_weight: 810
