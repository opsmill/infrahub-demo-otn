---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
#
# The physical plant: glass, trenches and the sections built out of them.
#
# A fiber span is not a device: it is not racked, it has no ports and no site of
# its own. It inherits OtnOpticalElement, which carries no relationships and no
# identity keys, and nothing else.
#
# Nothing here stores a total. A span's loss and a section's length and loss are
# computed from what is stored, so there is no second copy to keep in step.
version: "1.0"

# A `cardinality: one` relationship here gets an inverse when the peer is a page
# an operator lands on and the reverse list is what that page is for. Otherwise
# the reverse direction is a server-side filter on the forward side, which costs
# nothing and does not duplicate the fact. site_a and site_b have inverses on
# OtnSite in location.yml; roadm_a and roadm_b have inverses on OtnRoadm in
# otn_devices.yml. Every inverse reuses the identifier declared here, and an
# inverse on a new identifier loads without complaint and then reads an empty
# list.
nodes:
  - name: FiberType
    namespace: Otn
    description: Single-mode fiber family. Attenuation, dispersion and group index at 1550 nm.
    label: Fiber type
    icon: mdi:cable-data
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 32
          regex: "^[A-Za-z0-9.-]+$"
        optional: false
        description: ITU-T designation, such as G.652.D.
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # One coefficient per fibre family, measured at 1550 nm, and the budget
      # engine applies it to every span it is given. That is right for the dense
      # grid, where every channel sits between 1530 and 1565 nm. It is wrong for
      # a coarse wavelength, where it understates the loss over the coarse tail
      # by about a decibel, more than the margin by which a section in this
      # dataset already fails.
      #
      # So no coarse span reaches the engine: a coarse span belongs to no
      # optical multiplex section, and tests/unit/test_geant_dataset.py refuses
      # an `oms` on any span touching a site of `site_type: customer`. Budgeting
      # a coarse link needs a coefficient per wavelength band, which is a schema
      # change.
      - name: attenuation_mdb_per_km
        kind: Number
        parameters:
          min_value: 150
          max_value: 400
        optional: false
        description: Attenuation at 1550 nm in millidecibels per kilometre. 0.20 dB/km is 200. Wrong for CWDM.
        order_weight: 1500
      - name: attenuation_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if attenuation_mdb_per_km__value is not none %}{{ attenuation_mdb_per_km__value / 1000 }} dB/km{% endif %}
        optional: true
        description: Attenuation in dB/km. Read-only, derived from attenuation_mdb_per_km.
        order_weight: 1510
      - name: dispersion_fs_per_nm_km
        kind: Number
        parameters:
          min_value: 0
          max_value: 30000
        optional: false
        description: Chromatic dispersion at 1550 nm in femtoseconds per nm per km. 17 ps/nm/km is 17000.
        order_weight: 1600
      - name: dispersion_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if dispersion_fs_per_nm_km__value is not none %}{{ dispersion_fs_per_nm_km__value / 1000 }} ps/nm/km{% endif %}
        optional: true
        description: Dispersion in ps/nm/km. Read-only, derived from dispersion_fs_per_nm_km.
        order_weight: 1610
      - name: group_index_milli
        kind: Number
        default_value: 1468
        parameters:
          min_value: 1400
          max_value: 1500
        optional: false
        description: Group index at 1550 nm in milli-units. 1.468 is 1468. Sets propagation delay.
        order_weight: 1700
    relationships:
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_fiber_type__spans
        on_delete: no-action
        order_weight: 900

  - name: Conduit
    namespace: Otn
    description: Shared-risk link group. Two routes through one conduit are not diverse.
    label: Conduit
    icon: mdi:pipe
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: owner
        kind: Text
        parameters:
          max_length: 64
        optional: true
        description: Who owns the trench. Often not the network operator.
        order_weight: 1100
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
    relationships:
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_conduit__spans
        on_delete: no-action
        order_weight: 900

  - name: FiberSpan
    namespace: Otn
    description: One amplifier-to-amplifier fiber section. Lossy, but not racked and not a device.
    label: Fiber span
    icon: mdi:vector-line
    include_in_menu: false
    inherit_from:
      - OtnOpticalElement
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # element_class is restated to give it a default_value, and the ten choices
    # come with it because overriding an inherited Dropdown requires the full
    # list. Omitting the `choices` key is rejected at load; a list that is one
    # choice short is accepted in silence and only fails when an object writes
    # the missing value. tests/unit/test_schema_contract.py holds every
    # restatement to the generic's list.
    #
    # The inherited insertion_loss_mdb stays at its default of 0 on a span. A
    # span's real loss is length x attenuation plus splices plus connectors plus
    # aging margin, and the budget engine computes it on demand. The stored 0
    # does not mean the span is lossless.
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: fiber_span
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # Not unique: a uniqueness constraint cannot reference an optional
      # relationship, and oms has to stay optional so a span is creatable before
      # its section exists. Duplicate positions are rejected by a check, not by
      # the schema.
      - name: oms_sequence
        kind: Number
        parameters:
          min_value: 1
          max_value: 50
        optional: true
        description: Position of this span within its optical multiplex section, counting from the A end.
        order_weight: 1200
      - name: length_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 500000
        optional: false
        description: Route length in metres, not straight-line distance. 500 km is the practical ceiling.
        order_weight: 1500
      - name: length_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if length_m__value is not none %}{{ length_m__value / 1000 }} km{% endif %}
        optional: true
        description: Route length in km. Read-only, derived from length_m.
        order_weight: 1510
      - name: splice_count
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 500
        optional: false
        description: Fusion splices along the span. Roughly one per drum of cable.
        order_weight: 1600
      - name: splice_loss_mdb
        kind: Number
        default_value: 50
        parameters:
          min_value: 0
          max_value: 1000
        optional: false
        description: Loss per splice in millidecibels. 0.05 dB is 50.
        order_weight: 1610
      - name: connector_count
        kind: Number
        default_value: 2
        parameters:
          min_value: 0
          max_value: 20
        optional: false
        description: Mated connector pairs on the span, normally one at each end.
        order_weight: 1700
      - name: connector_loss_mdb
        kind: Number
        default_value: 300
        parameters:
          min_value: 0
          max_value: 2000
        optional: false
        description: Loss per mated connector pair in millidecibels. 0.3 dB is 300.
        order_weight: 1710
      - name: aging_margin_mdb
        kind: Number
        default_value: 1500
        parameters:
          min_value: 0
          max_value: 5000
        optional: false
        description: Reserved margin for repairs and ageing, in millidecibels. 1.5 dB is 1500.
        order_weight: 1720
    relationships:
      - name: fiber_type
        peer: OtnFiberType
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_fiber_type__spans
        on_delete: no-action
        order_weight: 800
      - name: site_a
        peer: OtnSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_a
        on_delete: no-action
        order_weight: 810
      - name: site_b
        peer: OtnSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_b
        on_delete: no-action
        order_weight: 820
      - name: conduit
        peer: OtnConduit
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_conduit__spans
        on_delete: no-action
        order_weight: 830
      - name: oms
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_oms__spans
        on_delete: no-action
        order_weight: 840
      # The inverse of OtnRamanPump.span, on the same identifier, and both sides
      # are needed. A budget walks a section, reaches its spans and reads what
      # is on them; without this side nothing on that walk can see a pump, so
      # every pumped span sums to zero gain and the check passes while reporting
      # a loss the network does not have. It is also what makes OtnRamanPump
      # reachable in the UI, because the sidebar does not name device kinds, and
      # tests/unit/test_menu.py asserts that.
      - name: raman_pumps
        peer: OtnRamanPump
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__raman_pumps
        on_delete: no-action
        order_weight: 850

  - name: OpticalMultiplexSection
    namespace: Otn
    description: ROADM to ROADM. Groups the ordered spans and inline amplifiers between two degrees.
    label: Optical multiplex section
    icon: mdi:ray-start-end
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # No total_length_m, no total_loss_mdb, no span_count and no hop_count.
    # Every reader sums them over the spans instead.
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
    relationships:
      - name: roadm_a
        peer: OtnRoadm
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_oms__roadm_a
        on_delete: no-action
        order_weight: 800
      - name: roadm_b
        peer: OtnRoadm
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_oms__roadm_b
        on_delete: no-action
        order_weight: 810
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__spans
        on_delete: no-action
        order_weight: 900
      # One relationship per direction of travel, rather than one holding both
      # chains. Which chain an amplifier is in is then stored by the graph, and
      # no attribute on the amplifier can disagree with it.
      #
      # Both stay optional: a section is creatable before its amplifiers exist.
      # A query that selects one and forgets the other is not an error at the
      # server, and `peers` hands back an empty list for a key that is not
      # there, so the loud failure is the budget engine's N+1 rule instead.
      - name: amplifiers_a2b
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_a2b
        on_delete: no-action
        order_weight: 910
      - name: amplifiers_b2a
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_b2a
        on_delete: no-action
        order_weight: 920
