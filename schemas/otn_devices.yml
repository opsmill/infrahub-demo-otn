---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
#
# The eight concrete device kinds.
#
# OtnRouter inherits OtnGenericDevice only. Every other device here also
# inherits OtnOpticalElement. Light terminates at a router, so a router
# contributes no insertion loss and a query against OtnOpticalElement must
# return eight kinds and not nine. Adding the generic to the router to make the
# list look tidy breaks the query the optical budget engine depends on.
version: "1.0"

# All seven device kinds that inherit OtnOpticalElement restate element_class,
# to give it a default_value. The ten choices come with it, and the repetition
# is only half guarded by the server: omitting the `choices` key from an
# override is rejected at load with "The property 'choices' is required for kind=Dropdown",
# while a `choices` key holding nine of the ten is accepted in silence and the
# divergence surfaces only when an object writes the value the override left
# out. tests/unit/test_schema_contract.py asserts every override matches the
# generic's list, and it is the only thing that does. OtnOduSwitch is the
# seventh and the tenth choice `odu_switch` exists for it; the comment on that
# node says why nothing else would have been true.
nodes:
  - name: Router
    namespace: Otn
    description: IP router. Light terminates here, so it contributes no insertion loss.
    label: Router
    icon: mdi:router
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice

  - name: Transponder
    namespace: Otn
    description: Client to DWDM line adaptation.
    label: Transponder
    icon: mdi:transit-connection-variant
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: transponder
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800

  - name: Roadm
    namespace: Otn
    description: Reconfigurable optical add/drop multiplexer.
    label: ROADM
    icon: mdi:call-split
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: roadm
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
    # The inverses of OtnOpticalMultiplexSection.roadm_a and .roadm_b, each on
    # the identifier its forward side declares. A ROADM inherits site at 800 and
    # ports at 900, so these follow at 960 and 970.
    relationships:
      - name: sections_a
        peer: OtnOpticalMultiplexSection
        label: Sections (A end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__roadm_a
        on_delete: no-action
        order_weight: 960
      - name: sections_b
        peer: OtnOpticalMultiplexSection
        label: Sections (B end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__roadm_b
        on_delete: no-action
        order_weight: 970

  - name: Amplifier
    namespace: Otn
    description: Inline, booster or pre-amplifier.
    label: Amplifier
    icon: mdi:amplifier
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    # oms_sequence is stored because Infrahub relationships carry no order, so
    # OtnOpticalMultiplexSection.amplifiers hands back a set. The budget cannot
    # be walked over a set: the loss ahead of an amplifier is the loss of
    # whatever sits immediately before it. OtnFiberSpan carries an explicit
    # position for the same reason.
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: amplifier
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
      # 3000 is the quantum-limited floor for an EDFA and 10000 is a bad one, so
      # the bounds bracket the whole plausible range rather than this dataset's.
      - name: noise_figure_mdb
        kind: Number
        default_value: 4000
        parameters:
          min_value: 3000
          max_value: 10000
        optional: false
        description: Noise figure in millidecibels. 4.0 dB is 4000. Sets the ASE this stage adds.
        order_weight: 1520
      - name: noise_figure_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if noise_figure_mdb__value is not none %}{{ noise_figure_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Noise figure in dB. Read-only, derived from noise_figure_mdb.
        order_weight: 1530
      - name: gain_mdb
        kind: Number
        default_value: 22000
        parameters:
          min_value: 0
          max_value: 40000
        optional: false
        description: Gain in millidecibels. 22.0 dB is 22000. Must cover the loss ahead of the input.
        order_weight: 1540
      - name: gain_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if gain_mdb__value is not none %}{{ gain_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Gain in dB. Read-only, derived from gain_mdb.
        order_weight: 1550
      # No direction attribute. An amplifier hut is bidirectional and this model
      # gives each direction its own object, but which chain an object is in is
      # the relationship holding it, oms_a2b or oms_b2a, and an attribute
      # restating that would be a second copy that can disagree with the first.
      #
      # It does two jobs and both are its own. It orders a chain that the
      # relationship has already identified, so a sorted chain is in traversal
      # order and the engine never reverses one. And it fixes which member of
      # that chain is which: position 1 is the booster, position N+1 is the
      # pre-amplifier, and amplifier k feeds span k of its own walk.
      - name: oms_sequence
        kind: Number
        parameters:
          min_value: 1
          # 51, not 50: a section with N spans carries N+1 amplifiers per
          # direction, and the span attribute caps N at 50.
          max_value: 51
        # Mandatory, and with no default_value on purpose. A default of 1 would
        # let a new amplifier take a silent position at the head of its chain,
        # collide with the real first amplifier, and sort stably into a wrong
        # answer rather than raising.
        #
        # Not unique, and it cannot be: a uniqueness constraint cannot reference
        # an optional relationship, and the section relationships have to stay
        # optional so an amplifier is creatable before its section exists.
        # Rejecting duplicate positions is a test's job.
        optional: false
        description: Position in this amplifier's own chain, counting along the direction it amplifies.
        order_weight: 1560
    # The two inverses of the section's two amplifier relationships, each on the
    # matching identifier. Exactly one is set on any amplifier, and which one it
    # is answers the direction question the deleted attribute used to answer.
    #
    # Two, not one, because one relationship cannot be the inverse of two
    # identifiers. The alternative was dropping the amplifier's section
    # relationship entirely and reaching the section by server-side filter, and
    # that was rejected: an amplifier page is a page an operator lands on, and
    # "which section and which way" is what it is for. The honest accounting is
    # that this trades one attribute for one relationship and the schema does
    # not get shorter.
    relationships:
      - name: oms_a2b
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        # Both optional, because an amplifier is creatable before its section
        # exists.
        optional: true
        identifier: otn_oms__amplifiers_a2b
        on_delete: no-action
        order_weight: 950
      - name: oms_b2a
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_oms__amplifiers_b2a
        on_delete: no-action
        order_weight: 960

  - name: MuxDemux
    namespace: Otn
    description: Passive multiplexer. A dense AWG on the core, a coarse thin-film filter on a tail.
    label: Mux/demux
    icon: mdi:call-merge
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: mux_demux
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
    relationships:
      # The wavelengths a coarse multiplexer lights are a property of the device
      # rather than of the plan. Without this relationship OtnCwdmChannel is a
      # kind nothing points at, which fails the sidebar reachability test in
      # tests/unit/test_menu.py.
      - name: cwdm_channels
        peer: OtnCwdmChannel
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_mux_demux__cwdm_channels
        on_delete: no-action
        order_weight: 1900

  - name: PatchPanel
    namespace: Otn
    description: Optical distribution frame. Carries connector loss.
    label: Patch panel
    icon: mdi:view-grid-outline
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: patch_panel
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800

  - name: RamanPump
    namespace: Otn
    description: Pump laser injecting Raman gain into one fiber span.
    label: Raman pump
    icon: mdi:laser-pointer
    include_in_menu: false
    # Two generics, listed side by side. Infrahub's GenericSchemaWrite has no
    # inherit_from key, so OtnOpticalElement cannot inherit OtnGenericDevice and
    # a kind that is both a racked device and something light passes through has
    # to say so twice.
    #
    # No attribute storing which direction the pump amplifies. That is the
    # conclusion, and injection_end and propagation are the two physical facts
    # that compute it: a counter-propagating pump fires back up the fibre from
    # the far end, so one at the B end amplifies the A to B signal, and a
    # co-propagating pump at the A end amplifies it too.
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: raman_pump
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
      # On-off gain: the difference in received signal power with the pump on
      # against the pump off. It reduces the effective loss of the span it sits
      # on rather than adding a stage to the chain, which is why the budget
      # subtracts it from the fiber loss and no amplifier object is involved.
      - name: on_off_gain_mdb
        kind: Number
        default_value: 10000
        parameters:
          min_value: 0
          max_value: 15000
        optional: false
        description: Raman on-off gain in millidecibels. 10.0 dB is 10000.
        order_weight: 1520
      - name: on_off_gain_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if on_off_gain_mdb__value is not none %}{{ on_off_gain_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: On-off gain in dB. Read-only, derived from on_off_gain_mdb.
        order_weight: 1530
      # Where the pump is spliced in. The two choices name the span's own
      # endpoint relationships, site_a and site_b, rather than inventing a
      # vocabulary.
      #
      # default_value exists because a mandatory attribute needs one for the
      # schema to load, and site_b is what every shipped counter-propagating
      # forward pump takes. It is a loading device and not an assertion: the
      # generator writes the value explicitly on every pump, and injection_end
      # is in NEVER_SUPPRESSED so the generated file always shows it.
      - name: injection_end
        kind: Dropdown
        default_value: site_b
        choices:
          - name: site_a
            label: Site A end
            color: "#2196f3"
          - name: site_b
            label: Site B end
            color: "#ff5722"
        optional: false
        description: Which end of its span the pump is injected at, named against the span's own site_a and site_b.
        order_weight: 1540
      # Counter-propagating is the default: the pump fires against the signal,
      # so pump noise is averaged over the span instead of landing on the signal
      # at its weakest point. The budget reads this and injection_end together:
      # the direction a pump amplifies is
      # (injection_end == site_a) == (propagation == co).
      - name: propagation
        kind: Dropdown
        default_value: counter
        choices:
          - name: counter
            label: Counter-propagating
            color: "#3f51b5"
          - name: co
            label: Co-propagating
            color: "#009688"
        optional: false
        description: Whether the pump fires against the signal or with it.
        order_weight: 1550
    # Mandatory: a detached pump is gain the budget can never find. The inverse
    # `raman_pumps` lives on OtnFiberSpan in otn_plant.yml and carries the same
    # identifier.
    relationships:
      - name: span
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__raman_pumps
        on_delete: no-action
        order_weight: 850

  - name: OduSwitch
    namespace: Otn
    description: O-E-O device. Terminates one wavelength and originates the next, as a regenerator or an ODU cross-connect.
    label: ODU switch
    icon: mdi:swap-horizontal-variant
    include_in_menu: false
    # Two flat generics side by side, the composition OtnMuxDemux already uses.
    # OtnOpticalElement is here because OtnPathHop.element peers that generic,
    # and a segment's route has to be able to name the device it terminates on.
    #
    # insertion_loss_mdb arrives with OtnOpticalElement and applies to the
    # incoming segment only. This device terminates the light rather than
    # passing it through, so the outgoing segment starts at a transmitter and
    # not at an attenuated signal. That asymmetry is why the loss cannot be
    # added into one total spanning both segments: each segment carries its own
    # budget and the device is the boundary between them.
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    # element_class defaults to `odu_switch`, the tenth choice, added when the
    # first object forced the decision. None of the original nine names an O-E-O
    # device, so the alternative was defaulting to `transponder` or `roadm`,
    # which puts a false value on the one attribute that says what a device is.
    # Nothing in the repository reads element_class, so a wrong label costs
    # nothing mechanically and is simply untrue in the data, which is the whole
    # argument for paying for the tenth choice instead.
    attributes:
      # The choice cost nine blocks: the generic in otn_base.yml, the six older
      # overrides here, this one, the span's in otn_plant.yml, and the pinned
      # list in tests/unit/test_schema_contract.py. A block missed is a dropdown
      # offering different options depending on the kind you look at, and the
      # server accepts that in silence.
      - name: element_class
        kind: Dropdown
        default_value: odu_switch
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
      # `regenerator` is the default because it is the cheaper device and the
      # one a route that does not close needs: it carries the whole payload
      # across without looking inside it. `cross_connect` demultiplexes to
      # containers and regroups them, which is what lets the segments either
      # side carry different clients.
      - name: switching_mode
        kind: Dropdown
        default_value: regenerator
        choices:
          - name: regenerator
            label: Regenerator
            color: "#3f51b5"
          - name: cross_connect
            label: ODU cross-connect
            color: "#009688"
        optional: false
        description: Whether the device carries the whole payload through or demultiplexes and regroups containers.
        order_weight: 1300
      # Nanoseconds as an integer, the unit OtnOpticalMode.fec_latency_ns and
      # OtnOpticalPath.latency_ns already use. No Float kind exists.
      #
      # No paired _display, for the reason fec_latency_ns has none: the whole
      # plausible range is hundreds of nanoseconds, and the repository's only
      # nanosecond rendering divides by 1000, so every device would read
      # "0.0 us". The figure an operator wants is the circuit total, and
      # latency_display on the path renders that.
      - name: framing_latency_ns
        kind: Number
        # A device nobody has characterised adds nothing to the circuit rather
        # than adding a guess.
        default_value: 0
        parameters:
          min_value: 0
          # fec_latency_ns's ceiling, reused. A framing delay of 100 us would be
          # the largest single term in the whole latency budget.
          max_value: 100000
        optional: false
        description: Delay this device adds in nanoseconds, from framing and from the electrical crossing.
        order_weight: 1520
    # The wavelengths this device terminates. It is what
    # src/infrahub_demo_otn/chains.py reads to learn which carriers a junction
    # can join, and it is the whole of the junction predicate: a device with an
    # empty list contributes no junction.
    relationships:
      # It is not what finds the chain, and R-008 measured that rather than
      # assuming it. A device-to-device traversal filtered on this edge alone
      # returns zero paths, because a ROADM has no edge to a carrier and a
      # carrier has no edge to a device other than this one. Widen the filter
      # until paths come back and dropping this edge from it changes nothing
      # about which paths come back: 100 either way, and 48 of those join two
      # carriers at the one section all 71 of them cross, with nothing there to
      # terminate the light and re-originate it. Choosing the cover is a search
      # over the carriers this relationship names, not a traversal this
      # relationship makes possible.
      - name: carriers
        peer: OtnOpticalCarrier
        label: Carriers terminated here
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_odu_switch__carriers
        # Matching the other side and every other cross-reference here. A device
        # and a wavelength are independent objects: deleting either one leaves
        # the other.
        on_delete: no-action
        order_weight: 1900
