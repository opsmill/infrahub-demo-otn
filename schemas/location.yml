---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
#
# LocationGeneric, vendored from opsmill/schema-library, base/location.yml at
# v1.4.11 (tag 18a5b32b84feb7bbe940492c6282b405a5c582e0). The file itself last
# changed in commit 9256786, 2025-12-29. A hand-copied schema diverges in
# silence, so `uv run invoke schema-vendor-diff` fetches that ref and diffs it
# against this file. Not part of `lint`: it needs the network.
version: "1.0"

# Vendored rather than imported whole, because a schema file is not atomic.
# Taking this one entire also takes `LocationHosting`, which peers IpamPrefix
# and DcimPhysicalDevice and would drag a competing device and interface
# hierarchy into this repo. LocationGeneric's only peer is BuiltinTag, which
# ships with Infrahub core, so this subset costs nothing. An audit challenged
# the copy once and that is the answer that closed it.
#
# Three deliberate divergences from the ref and nothing else: `LocationHosting`
# is not taken, for the reason above; `include_in_menu` is flipped to false, see
# the comment on it; and the deprecated plural `display_labels` becomes
# `display_label`, which is the only form used in this repository.
generics:
  - name: Generic
    namespace: Location
    description: Generic Location, could be a country, city ...
    label: Location
    icon: mingcute:location-line
    # Upstream ships this as true. Every kind here is hidden from the automatic
    # menu and reached through menus/otn.yml, which has its own Sites entry;
    # left visible, the sidebar carries a second root entry onto the same
    # objects.
    include_in_menu: false
    hierarchical: true
    human_friendly_id:
      - shortname__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 1000
      - name: shortname
        kind: Text
        unique: true
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    relationships:
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        # Local addition. Tag and metadata relationships sit at 3000+ here and
        # every other relationship in 790-970. `OtnMuxDemux.cwdm_channels` at
        # 1900 is the one exception, the only relationship weighted inside the
        # attribute band.
        order_weight: 3000
nodes:
  - name: Site
    namespace: Otn
    description: A PoP hosting OTN equipment, or a customer site handing traffic to one.
    label: OTN Site
    icon: ri:building-line
    # No menu_placement: it only positions a kind inside the auto-generated
    # sidebar, which both this node and LocationGeneric opt out of.
    include_in_menu: false
    # `CoreArtifactTarget` is declared here, on the node, because `inherit_from`
    # is the one thing a schema extension cannot add. An `extensions:` block can
    # bolt an attribute or a relationship onto a kind it does not own; it cannot
    # change what that kind inherits. So a site becomes an artifact target in
    # this file or not at all.
    #
    # It is a core generic, not a vendored one, so it adds no fourth divergence
    # to the three listed above: those are all against `LocationGeneric`, and
    # `OtnSite` is a wholly local node that `invoke schema-vendor-diff` never
    # compares against upstream. Two flat generics, neither inheriting the other.
    inherit_from:
      - LocationGeneric
      - CoreArtifactTarget
    parent: ""
    children: ""
    display_label: name__value
    attributes:
      - name: latitude_microdeg
        kind: Number
        parameters:
          min_value: -90000000
          max_value: 90000000
        optional: true
        description: Latitude in millionths of a degree. No Float kind exists.
        order_weight: 1400
      - name: longitude_microdeg
        kind: Number
        parameters:
          min_value: -180000000
          max_value: 180000000
        optional: true
        description: Longitude in millionths of a degree. No Float kind exists.
        order_weight: 1500
      # `customer` is a discriminator, not a label: the guard in
      # `tests/unit/test_geant_dataset.py` reads it to refuse an `oms` on any
      # span touching a customer site, which is what keeps a coarse metro tail
      # out of the budget engine and its 1550 nm coefficient. Full reasoning in
      # `docs/docs/demo-otn/schema-reference.mdx`, "site_type keeps the PoPs a
      # filter".
      - name: site_type
        kind: Dropdown
        default_value: pop
        choices:
          - name: pop
            label: PoP
            color: "#2196f3"
          - name: customer
            label: Customer site
            color: "#ff9800"
        optional: false
        description: >-
          A PoP or a customer site. Keeps "the fourteen PoPs" a filter rather than a
          count. No span on a customer site may declare an oms.
        order_weight: 1600
    # Four inverses, each reusing the identifier its forward side declares,
    # which is what makes them read the edges already in the graph rather than
    # an empty list. The forward sides are OtnGenericDevice.site in
    # otn_base.yml, OtnFiberSpan.site_a and .site_b in otn_plant.yml, and
    # OtnFacility.site below.
    #
    # The two span lists cannot be merged into one: merging the identifiers
    # would lose which end a span terminates on. The labels are what make the
    # union readable.
    relationships:
      # Cardinality one, and that is a decision. Six PoPs host one facility
      # each and none hosts two, so one is the honest reading of the network as
      # modelled. Widening to many later is a migration a reader can see
      # coming; narrowing from many to one is not, because it throws data away.
      - name: facility
        peer: OtnFacility
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_site__facility
        on_delete: no-action
        order_weight: 930
      - name: devices
        peer: OtnGenericDevice
        kind: Generic
        cardinality: many
        optional: true
        identifier: otn_site__devices
        on_delete: no-action
        order_weight: 900
      - name: spans_a
        peer: OtnFiberSpan
        label: Fiber spans (A end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__site_a
        on_delete: no-action
        order_weight: 910
      - name: spans_b
        peer: OtnFiberSpan
        label: Fiber spans (B end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__site_b
        on_delete: no-action
        order_weight: 920
  # Six EuroHPC facilities sit on six of the fourteen PoPs. Until this kind
  # existed the only record of that was the text after `eurohpc-` in a
  # BuiltinTag name, read back by a helper duplicated in two transforms. The
  # tag read was defended on a distinction that still holds: it read a tag, not
  # a device, and nothing about an amplifier, a ROADM or a router is recovered
  # from a name anywhere in this repository.
  #
  # The reversal is about something else. The failure was silent in both
  # directions, measured on a probe branch: renaming `eurohpc-vega` dropped
  # Vega from both maps and raised nothing, and a mistyped `eurohpc_deucalion`
  # made a facility no map draws and no check reports. An edge fails loudly.
  - name: Facility
    namespace: Otn
    description: A supercomputing facility hosted at a PoP.
    label: Facility
    icon: ri:cpu-line
    # Reached through the site it sits on, like every other kind here, so it
    # stays out of the automatic sidebar. menus/otn.yml carries the entries.
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      # The tag suffix, and it has to stay the tag suffix: mapchrome.py
      # upper-cases this string for the caption and the committed golden holds
      # the upper-cased suffix. So `marenostrum-5`, never `MareNostrum 5`.
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      # What a tag could never carry, and half the reason this is a kind.
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    # The six `eurohpc-` tags stay on their sites. They are data an operator
    # wrote and a sweep does not delete data. They stop being read, which was
    # the whole finding.
    relationships:
      - name: site
        peer: OtnSite
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_site__facility
        on_delete: no-action
        order_weight: 900
