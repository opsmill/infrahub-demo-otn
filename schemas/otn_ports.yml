  # One multiplexer channel and the common side it shares. Both take the two
  # flat generics and neither declares an insertion loss: the loss belongs to
  # the device and the budget engine already reads it from the path hop's
  # element, so a second per-port figure would only invite double counting.
  - name: MuxClientPort
    namespace: Otn
    description: One channel of a multiplexer. The side facing the transponder or router that lights it.
    label: Mux client port
    icon: mdi:import
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    # Two optional edges, not one mandatory edge to a channel generic shared
    # over the dense and coarse plans. The two grid kinds were kept apart
    # deliberately, and Infrahub has no cross-relationship constraint, so the
    # schema cannot say "exactly one of these two". mux_channel_binding owns
    # both the neither case and the both case.
    #
    # Neither cascades: deleting a channel must not delete the port that named
    # it.
    relationships:
      - name: dwdm_channel
        peer: OtnFrequencyGrid
        label: Dense channel this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_frequency_grid__mux_client_ports
        on_delete: no-action
        order_weight: 850
      - name: cwdm_channel
        peer: OtnCwdmChannel
        label: Coarse wavelength this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_cwdm_channel__mux_client_ports
        on_delete: no-action
        order_weight: 860

  # It binds no channel because it carries every channel the device lights.
  - name: MuxLinePort
    namespace: Otn
    description: The common side of a multiplexer, where the whole band leaves.
    label: Mux line port
    icon: mdi:export
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort

  - name: TributaryPort
    namespace: Otn
    description: E1 or T1 G.703 electrical tributary. The only copper port here.
    label: Tributary port
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnCopperPort

  # The five monitors. They declare readings, because what a monitor measures is
  # what distinguishes it. Eleven of the fourteen readings belong to exactly one
  # family, so a single kind with a discriminator could not say which readings a
  # monitor must carry and which it cannot take. Five kinds can, and the schema
  # then refuses both halves: a missing reading, because the attribute is
  # mandatory, and an impossible one, because the kind has no field for it.
  - name: AmplifierMonitor
    # Nothing here constrains which device kind a monitor may hang off, and that
    # is measured rather than overlooked. Infrahub 1.11.0 refuses to let a
    # concrete kind narrow the peer of a relationship it inherits, from either
    # end, at schema check and before any load. OtnGenericPort.device peers
    # OtnGenericDevice, so a receiver monitor on an amplifier is writable. The
    # remaining option was a Python check, which is the layer these five kinds
    # exist to leave, so the gap is accepted and stated instead. The generator
    # that writes the monitors is the only thing that ever creates one.
    namespace: Otn
    description: The last reading taken from an amplifier's monitoring interface.
    label: Amplifier monitor
    icon: mdi:gauge
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnMonitor
    order_by:
      - name__value
    attributes:
      - name: input_power_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 30000
        optional: false
        description: Total input power in millidecibel-milliwatts. -3.5 dBm is -3500.
        order_weight: 1200
      - name: input_power_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if input_power_mdbm__value is not none %}{{ input_power_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Input power in dBm. Read-only, derived from input_power_mdbm.
        order_weight: 1210
      - name: output_power_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 30000
        optional: false
        description: Total output power in millidecibel-milliwatts.
        order_weight: 1220
      - name: output_power_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if output_power_mdbm__value is not none %}{{ output_power_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Output power in dBm. Read-only, derived from output_power_mdbm.
        order_weight: 1230
      # measured_gain_mdb is declared here and on OtnRamanMonitor, with
      # identical bounds and an identical template. It cannot live on
      # OtnMonitor, because that would put a gain field on the channel and
      # receiver monitors, which is the failure these five kinds remove.
      - name: measured_gain_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 40000
        optional: false
        description: Gain the amplifier is actually delivering, in millidecibels.
        order_weight: 1240
      - name: measured_gain_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if measured_gain_mdb__value is not none %}{{ measured_gain_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Measured gain in dB. Read-only, derived from measured_gain_mdb.
        order_weight: 1250
      - name: tilt_mdb
        kind: Number
        parameters:
          min_value: -5000
          max_value: 5000
        optional: false
        description: Gain tilt across the band in millidecibels. Negative tilts the red end down.
        order_weight: 1260

  # No attributes of its own. Both readings come from OtnChannelMonitor, which
  # OtnMuxDemuxMonitor takes too, so the pair is declared once.
  - name: RoadmDegreeMonitor
    namespace: Otn
    description: The last reading taken from a ROADM degree's monitoring interface.
    label: ROADM degree monitor
    icon: mdi:gauge
