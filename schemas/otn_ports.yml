---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
#
# Fourteen concrete port kinds: nine that carry traffic and five that report on
# the equipment they hang off, plus the two kinds that inventory the pluggable
# optics fitted into them.
#
# A traffic port declares its inherit_from, the channel or carrier it binds if
# it binds one, and nothing else. Restating anything further would let it drift
# from the generic and break the premise that one query against OtnGenericPort
# returns every port kind with the same shape.
#
# The one exception is connector_type. OtnOpticalPort turned it into a Dropdown,
# and Infrahub refuses to change an attribute's kind on a generic underneath the
# kinds that already inherit it, so the six optical port kinds that predate the
# change restate the full nine-choice list. The two mux kinds are new and need
# no restatement. A restatement one choice short is accepted in silence, the
# same trap element_class carries in otn_devices.yml, and
# tests/unit/test_schema_contract.py is the only thing that catches it.
version: "1.0"

# Two flat generics. Generics cannot inherit generics in Infrahub, so the
# concrete monitors multi-inherit both plus OtnGenericPort, which is the shape
# OtnAmplifierPort already uses for OtnGenericPort and OtnOpticalPort.
#
# human_friendly_id and uniqueness_constraints are not declared here. Both come
# from OtnGenericPort, and a constraint on a generic binds across every kind
# that inherits it, so (device, name) stays unique across all five monitors
# taken together.
generics:
  - name: Monitor
    namespace: Otn
    description: The one fact every monitoring interface carries, whatever it measures.
    label: Monitor
    icon: mdi:gauge
    include_in_menu: false
    attributes:
      # A reading with no timestamp is not a reading. This is a last known
      # value, not a telemetry feed; the age is what makes drift meaningful.
      - name: measured_at
        kind: DateTime
        optional: false
        description: When this reading was taken.
        order_weight: 1110

  - name: ChannelMonitor
    namespace: Otn
    description: What a device that sees a band of channels reports about that band.
    label: Channel monitor
    icon: mdi:chart-histogram
    include_in_menu: false
    # A ROADM degree and a multiplexer report the same two numbers, so the two
    # are declared once here rather than twice. The kinds stay distinct,
    # because a degree and a multiplexer are different equipment and a query
    # should be able to say which it means. It also leaves room for the two to
    # diverge without a migration on loaded data.
    #
    # This generic does not inherit OtnMonitor. Generics do not inherit
    # generics; the concrete kinds take both.
    attributes:
      - name: total_power_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 30000
        optional: false
        description: Total power across all channels present, in millidecibel-milliwatts.
        order_weight: 1300
      - name: channel_count
        kind: Number
        parameters:
          min_value: 0
          max_value: 96
        optional: false
        description: How many channels the monitor currently sees.
        order_weight: 1310

nodes:
  - name: RouterPort
    namespace: Otn
    description: Grey optics on an IP router. Not on the C-band grid.
    label: Router port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The module fitted in this port, and the inverse of OtnTransceiver.port.
      # Both ends are cardinality one, so the edge is one to one: the server
      # refuses the second write with "has 2 peers for
      # otn_optical_port__transceiver, maximum of 1 allowed". That is the
      # duplicate rule, and it is here rather than in a check because the schema
      # refuses every write path and a check only reports on the next pipeline
      # run.
      #
      # Declared on the three concrete kinds that have a cage and never on the
      # OtnOpticalPort generic. The generic would hand the field to all eight
      # optical port kinds, including the five that hold no module.
      #
      # Optional on both sides, so a spare, an RMA and a decommissioned unit are
      # still modellable and no loaded port needs a value.
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 960

  - name: ClientPort
    namespace: Otn
    description: Transponder client side. Where grey light arrives.
    label: Client port
    icon: mdi:lan-connect
