        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 960

  - name: LinePort
    namespace: Otn
    description: Transponder DWDM line side. Where coloured light leaves.
    label: Line port
    icon: mdi:transit-connection
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The wavelength this port terminates, and the deletion boundary.
      #
      # Deleting a transponder already deletes this port: OtnGenericDevice.ports
      # is kind: Component with on_delete: cascade, and a port has no meaning
      # apart from the device it sits in. The deletion stops here.
      #
      # A carrier is not a component of a line port. It is a spectrum allocation
      # on a route, holding a channel, a mode, its sections, its containers and
      # possibly ODU switches, and it exists in the plan whether or not a box is
      # currently lighting it. Cascading from this port would reach the carrier's
      # containers and the services groomed into them, so pulling one transponder
      # would destroy customer service records. It would also delete the
      # wavelength out from under the line port at the far end, which is still
      # installed: a carrier is terminated at both of its ends.
      #
      # Same policy as OtnService.diversity_group and OtnService.containers, for
      # the same reason those two state.
      #
      # Light has direction, and that is not an argument for cascade here. A line
      # port is a transceiver: every one of them carries both tx_power_mdbm and
      # rx_sensitivity_mdbm, so there is no single transmitting end to own the
      # wavelength. Cascade on a cardinality-one relationship fires from either
      # port, so it would give two owners where the intuition asked for one.
      # OtnOpticalCarrier holds no direction at all, deliberately: where this
      # model needs direction it makes two objects, the way an amplifier hut
      # does, and the budget engine evaluates a carrier both ways and takes the
      # worse. Direction lives on the plant and on the path traversal, never on
      # the wavelength.
      #
      # The model also already says "the light stopped" with status, which is
      # planned, active or decommissioned. A planned carrier has no light and
      # exists anyway. This kind is a spectrum allocation on a route, not the
      # photons on it, and deleting a box must not silently release spectrum
      # that channel_collision.py exists to police.
      #
      # There is a demo argument too, and it is the stronger one. A cascade makes
      # the fault disappear. no-action leaves a lit carrier with nothing
      # terminating it, which is visible and checkable, the shape
      # monitor_completeness already works in.
      - name: carrier
        peer: OtnOpticalCarrier
        label: Wavelength this port terminates
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_carrier__line_ports
        on_delete: no-action
        order_weight: 850
      # The same one-to-one edge OtnRouterPort.transceiver documents, on the
      # kind that takes a coloured pluggable on the line side.
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 960

