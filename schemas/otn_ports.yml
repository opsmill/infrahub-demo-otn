  - name: RamanMonitor
    namespace: Otn
    description: The last reading taken from a Raman pump's monitoring interface.
    label: Raman monitor
    icon: mdi:gauge
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnMonitor
    order_by:
      - name__value
    attributes:
      # The same declaration OtnAmplifierMonitor carries. Two kinds, one gain
      # reading each, and no gain field on the three kinds that cannot produce
      # one.
      - name: measured_gain_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 40000
        optional: false
        description: Gain the amplifier is actually delivering, in millidecibels.
        order_weight: 1240
      - name: measured_gain_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if measured_gain_mdb__value is not none %}{{ measured_gain_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Measured gain in dB. Read-only, derived from measured_gain_mdb.
        order_weight: 1250
      - name: pump_power_mdbm
        kind: Number
        parameters:
          min_value: 0
          max_value: 40000
        optional: false
        description: Raman pump launch power in millidecibel-milliwatts.
        order_weight: 1400
      - name: back_reflection_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 60000
        optional: false
        description: Return loss seen by the pump, in millidecibels. A safety interlock reading.
        order_weight: 1410

  - name: ReceiverMonitor
    namespace: Otn
    description: The last reading taken from a transponder receiver's monitoring interface.
    label: Receiver monitor
    icon: mdi:gauge
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnMonitor
    order_by:
      - name__value
    attributes:
      # OSNR sits here and on no other monitor kind. A coherent receiver's DSP
      # computes it. An amplifier reports power, not OSNR, and after the split
      # there is no field on an amplifier monitor to put it in.
      - name: measured_osnr_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 50000
        optional: false
        description: OSNR the receiver reports, in millidecibels. 24.1 dB is 24100.
        order_weight: 1500
      - name: measured_osnr_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if measured_osnr_mdb__value is not none %}{{ measured_osnr_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Measured OSNR in dB. Read-only, derived from measured_osnr_mdb.
        order_weight: 1510
      - name: rx_power_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 10000
        optional: false
        description: Received power at the coherent front end, in millidecibel-milliwatts.
        order_weight: 1520
      # Parts per billion keeps a bit error rate an integer: 2.1e-3 is 2100000.
      - name: pre_fec_ber_ppb
        kind: Number
        parameters:
          min_value: 0
          max_value: 1000000000
        optional: false
        description: Pre-FEC bit error rate in parts per billion. 2.1e-3 is 2100000.
        order_weight: 1530
      - name: q_factor_mdb
        kind: Number
        parameters:
          min_value: 0
          max_value: 30000
        optional: false
        description: Q factor in millidecibels.
        order_weight: 1540
      - name: cd_fs_per_nm
        kind: Number
        parameters:
          min_value: -100000000
          max_value: 100000000
        optional: false
        description: Chromatic dispersion the receiver compensated, in femtoseconds per nanometre.
        order_weight: 1550
      - name: dgd_fs
        kind: Number
        parameters:
          min_value: 0
          max_value: 200000
        optional: false
        description: Differential group delay in femtoseconds.
        order_weight: 1560

  # The catalog entry and the physical unit. Neither inherits anything: a part
  # number is not racked and is not something light passes through, and a
  # pluggable is a part fitted into a port rather than a port itself. They live
  # in this file beside the ports they plug into, so the schema file count does
  # not move.
  - name: TransceiverType
    namespace: Otn
    description: A pluggable optic part number and what it can be made to do.
    label: Transceiver type
    icon: mdi:chip
    include_in_menu: false
    human_friendly_id:
      - part_number__value
    order_by:
      - part_number__value
    display_label: part_number__value
    attributes:
      - name: part_number
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/+-]+$"
        optional: false
        description: Vendor part number, such as QDD-400G-ZRP-S.
        order_weight: 1000
      - name: vendor
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1100
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
      - name: form_factor
        kind: Dropdown
        choices:
          - name: QSFP-DD
            label: QSFP-DD
            description: Eight-lane double-density cage. What a coherent 400G pluggable takes.
            color: "#2196f3"
          - name: QSFP28
            label: QSFP28
            description: Four-lane cage, 100G grey optics.
            color: "#4caf50"
          - name: OSFP
            label: OSFP
            description: Eight-lane cage with a larger thermal budget than QSFP-DD.
            color: "#9c27b0"
          - name: CFP2-DCO
            label: CFP2-DCO
            description: Digital coherent optic. The DSP is in the module.
            color: "#ff9800"
          - name: CFP2-ACO
            label: CFP2-ACO
            description: Analogue coherent optic. The DSP is on the host card.
            color: "#ffc107"
          - name: SFP28
            label: SFP28
            description: Single-lane 25G cage.
            color: "#00bcd4"
          - name: SFP+
            label: SFP+
            description: Single-lane 10G cage.
            color: "#9e9e9e"
        optional: false
        description: The cage this part fits. It decides which ports can hold it.
        order_weight: 1300
      # A fixed-wavelength optic can only ever sit on the channel it was bought
      # for, which is what makes this worth storing rather than deriving.
      - name: tunable
        kind: Boolean
        default_value: false
        optional: false
        description: Whether the laser can be tuned across the grid or is fixed at one wavelength.
        order_weight: 1400
    # Mandatory: a part that runs no mode says nothing about what it can do, and
    # transceiver_mode_support has nothing to compare the carrier against.
    relationships:
      - name: supported_modes
        peer: OtnOpticalMode
        label: Modes this part can run
        kind: Attribute
        cardinality: many
        optional: false
        identifier: otn_optical_mode__transceiver_types
        on_delete: no-action
        order_weight: 900

  - name: Transceiver
    namespace: Otn
    description: One physical pluggable optic, fitted in a port or sitting on a shelf.
    label: Transceiver
    icon: mdi:memory
    include_in_menu: false
    human_friendly_id:
      - serial__value
    order_by:
      - serial__value
    display_label: "{{ type__part_number__value }} {{ serial__value }}"
    attributes:
      - name: serial
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        description: Vendor serial number. The only thing that identifies this unit.
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: spare
        choices:
          - name: in_service
            label: In service
            color: "#4caf50"
          - name: spare
            label: Spare
            color: "#2196f3"
          - name: rma
            label: Returned to vendor
            color: "#ff9800"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1100
    relationships:
      - name: type
        peer: OtnTransceiverType
        label: Part this unit is
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_transceiver_type__units
        on_delete: no-action
        order_weight: 900
      # Optional, and therefore carrying no uniqueness constraint. Infrahub
      # refuses a constraint on an optional relationship, and making this one
      # mandatory would leave a spare, an RMA and a decommissioned unit
      # unmodellable, which is most of what an optic inventory holds.
      #
      # The duplicate is refused anyway, by the inverse rather than by a
      # constraint. OtnLinePort, OtnClientPort and OtnRouterPort each declare a
      # cardinality-one `transceiver` on this identifier, so both ends of the
      # edge are cardinality one and the second module in a port is refused at
      # write time. The inverse is on those three concrete kinds and not on the
      # OtnOpticalPort generic, which would have handed the field to the five
      # port kinds that hold no module.
      #
      # The port kind stays with the transceiver_placement check. This peers the
      # generic, and a relationship to a generic cannot be filtered by peer
      # kind, so the schema accepts a module written into an amplifier port.
      - name: port
        peer: OtnOpticalPort
        label: Port this unit is fitted in
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 950
