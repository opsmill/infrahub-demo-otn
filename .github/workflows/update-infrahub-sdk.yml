---
# yamllint disable rule:truthy rule:line-length
name: Update infrahub-sdk

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the latest infrahub-sdk release
        id: latest
        run: |
          LATEST=$(curl -sf https://pypi.org/pypi/infrahub-sdk/json | jq -r '.info.version')
          CURRENT=$(grep -oE 'infrahub-sdk\[all,ctl\]==[0-9.]+' pyproject.toml | cut -d= -f3)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current ${CURRENT}, latest ${LATEST}"

      # Two `sed -i` calls against tests/unit/test_pins.py used to follow this
      # one, aligning assertions that no longer exist. The file did not exist
      # either, so `sed` exited 2 and the step failed under `bash -e`: the run
      # on 2026-08-31 resolved 1.23.0 -> 1.23.1 correctly and then died before
      # opening anything. This workflow had never once produced a pull request.
      # test_pins.py now exists and guards the Infrahub version instead, which
      # is derived rather than restated, so nothing here needs to edit it.
      - name: Bump the pin
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.latest }}"
          CURRENT="${{ steps.latest.outputs.current }}"
          sed -i "s|infrahub-sdk\[all,ctl\]==${CURRENT}|infrahub-sdk[all,ctl]==${LATEST}|" pyproject.toml
          # Read back, so a specifier that changes shape fails here rather than
          # opening an empty pull request.
          grep -qF "infrahub-sdk[all,ctl]==${LATEST}" pyproject.toml || {
            echo "::error::The infrahub-sdk specifier did not take the rewrite."
            exit 1
          }

      - uses: astral-sh/setup-uv@v7
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        with:
          version: "0.9.18"

      # Without this the pull request carries a pyproject.toml and a uv.lock
      # that disagree about the pin.
      - name: Refresh the lock
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        run: uv lock

      - name: Open a pull request
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          branch: "chore/infrahub-sdk-${{ steps.latest.outputs.latest }}"
          title: "Bump infrahub-sdk to ${{ steps.latest.outputs.latest }}"
          commit-message: "Bump infrahub-sdk to ${{ steps.latest.outputs.latest }}"
          labels: dependencies
          body: |
            Automated bump from ${{ steps.latest.outputs.current }} to ${{ steps.latest.outputs.latest }}.

            Check `traverse_paths()` signatures before merging. The routing and
            impact features depend on them.

            The `docker-build` CI job will confirm the new SDK still coexists
            with the one in the Infrahub base image.
