---
# yamllint disable rule:truthy rule:line-length
name: Update infrahub-sdk

# Dispatch-driven, the way infrahub-demo-dc does it. An SDK release is an event
# infrahub-sdk-python already announces, and the Monday cron this replaced both
# lagged it by up to a week and raced Dependabot's `infrahub-sdk` group, which
# polls on the same morning: one release, two pull requests, no way to tell
# which arrived first.
#
# For the dispatch to land, `opsmill/infrahub-demo-otn` also has to appear in the
# matrix of `infrahub-sdk-python/.github/workflows/repository-dispatch.yml`. It
# does not yet: that matrix names emma, infrahub-demo-dc, infrahub-sync and a
# customer repository. Until it does, this workflow only runs by hand, and
# Dependabot remains the path that actually notices a release.
on:
  repository_dispatch:
    types: [trigger-infrahub-sdk-python-update]
  workflow_dispatch:
    inputs:
      infrahub_sdk_version:
        description: "infrahub-sdk version to move to. Leave blank to take the latest from PyPI."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  UV_VERSION: "0.9.18"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-infrahub-sdk-${{ github.event.client_payload.version || github.event.inputs.infrahub_sdk_version || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Resolved in the shell rather than in a ${{ }} expression on each later
      # step, for the same reason update-infrahub.yml does it: an expression that
      # evaluates to the empty string turns the rewrite below into a no-op that
      # still reports success.
      - name: Resolve the requested version
        id: resolve
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.infrahub_sdk_version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${PAYLOAD_VERSION:-}}"
          # A manual run with the input left blank still means "move to the
          # latest", which is what the cron used to do and the one part of it
          # worth keeping. A dispatch always names its version.
          if [ -z "${VERSION}" ]; then
            VERSION=$(curl -sf https://pypi.org/pypi/infrahub-sdk/json | jq -r '.info.version')
            echo "No version supplied; PyPI reports ${VERSION} as the latest."
          fi
          # Validated before it reaches a regex replacement. A dispatch payload
          # is not this repository's to trust, and the value is substituted
          # unquoted into a sed expression below.
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+[0-9a-z.]*$'; then
            echo "::error::'${VERSION}' does not look like an infrahub-sdk release."
            exit 1
          fi
          CURRENT=$(grep -oE 'infrahub-sdk\[all,ctl\]==[0-9][0-9a-z.]*' pyproject.toml | cut -d= -f3)
          if [ -z "${CURRENT}" ]; then
            echo "::error::Could not read the current infrahub-sdk pin out of pyproject.toml; its shape has changed and this workflow needs updating."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current ${CURRENT}, requested ${VERSION}"

      # Two `sed -i` calls against tests/unit/test_pins.py used to follow this
      # one, aligning assertions that no longer exist. The file did not exist
      # either, so `sed` exited 2 and the step failed under `bash -e`: the run
      # on 2026-08-31 resolved 1.23.0 -> 1.23.1 correctly and then died before
      # opening anything. This workflow had never once produced a pull request.
      # test_pins.py now exists and guards the Infrahub version instead, which
      # is derived rather than restated, so nothing here needs to edit it.
      - name: Bump the pin
        if: steps.resolve.outputs.version != steps.resolve.outputs.current
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CURRENT: ${{ steps.resolve.outputs.current }}
        run: |
          set -euo pipefail
          sed -i "s|infrahub-sdk\[all,ctl\]==${CURRENT}|infrahub-sdk[all,ctl]==${VERSION}|" pyproject.toml
          # Read back, so a specifier that changes shape fails here rather than
          # opening an empty pull request.
          grep -qF "infrahub-sdk[all,ctl]==${VERSION}" pyproject.toml || {
            echo "::error::The infrahub-sdk specifier did not take the rewrite."
            exit 1
          }

      - uses: astral-sh/setup-uv@v7
        if: steps.resolve.outputs.version != steps.resolve.outputs.current
        with:
          version: ${{ env.UV_VERSION }}

      # Without this the pull request carries a pyproject.toml and a uv.lock
      # that disagree about the pin.
      - name: Refresh the lock
        if: steps.resolve.outputs.version != steps.resolve.outputs.current
        run: uv lock

      - name: Open a pull request
        if: steps.resolve.outputs.version != steps.resolve.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          # GH_UPDATE_PACKAGE_OTTO, never the default GITHUB_TOKEN: a pull
          # request opened with GITHUB_TOKEN triggers no workflow runs, and the
          # docker-build job named in the body is the only thing that answers
          # whether the new SDK still coexists with the one in the base image.
          token: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
          branch: "chore/infrahub-sdk-${{ steps.resolve.outputs.version }}"
          title: "Bump infrahub-sdk to ${{ steps.resolve.outputs.version }}"
          commit-message: "Bump infrahub-sdk to ${{ steps.resolve.outputs.version }}"
          labels: dependencies
          body: |
            Automated bump from ${{ steps.resolve.outputs.current }} to ${{ steps.resolve.outputs.version }}.

            Check `traverse_paths()` signatures before merging. The routing and
            impact features depend on them.

            The `docker-build` CI job will confirm the new SDK still coexists
            with the one in the Infrahub base image.
