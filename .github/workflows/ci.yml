---
# yamllint disable rule:truthy rule:line-length
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The one way to ask for the full tier without editing a demo file. A release
  # rehearsal wants every scenario run against a tree that changed none of them.
  workflow_dispatch:
    inputs:
      tier:
        description: "Integration tier: core is about six minutes, full about fifty"
        type: choice
        options: ["core", "full"]
        default: "full"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.9.18"

jobs:
  files-changed:
    name: Detect which files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
      schema: ${{ steps.changes.outputs.schema_all }}
      documentation: ${{ steps.changes.outputs.documentation_all }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
      - uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
      # Full when the change can reach a scenario, core otherwise, and whatever
      # a dispatch asked for over both. Decided here rather than in an `if:` on
      # the steps below, so the answer is one value the log prints once and the
      # job cannot disagree with itself.
      - name: Decide the integration tier
        id: tier
        env:
          DEMO_CHANGED: ${{ steps.changes.outputs.demo_all }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TIER}" ]; then
            TIER="${DISPATCH_TIER}"
            WHY="asked for by this dispatch"
          elif [ "${DEMO_CHANGED}" = "true" ]; then
            TIER="full"
            WHY="this change touches a path that can break a scenario"
          else
            TIER="core"
            WHY="nothing the demo's scenarios read or write has changed"
          fi
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "::notice::Integration tier ${TIER}: ${WHY}."
          echo "- Integration tier: \`${TIER}\` (${WHY})" >> "$GITHUB_STEP_SUMMARY"

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Both ends of requires-python, so the supported range stays honest.
        # The upper bound is 3.14 because the Infrahub base image runs 3.14.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Check formatting
        run: uv run ruff format --check --diff
      # No separate `--select I` pass. `[tool.ruff.lint] select` in pyproject.toml
      # already carries "I", so the step below reports an unsorted import on its
      # own and the extra run was the same check twice.
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy src tests scripts

  budget-unit-tests:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      # No Infrahub needed. These always run, even when the stack is broken.
      - run: uv run pytest tests/unit -v

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - run: uv run yamllint -s .

  markdown-lint:
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          config: pyproject.toml
          report-type: annotations
          fail-on-error: true

  prose-lint:
    # Not gated on markdown alone. The em dash rule and the excluded-vocabulary
    # rule apply to Python docstrings, GraphQL comments and YAML descriptions
    # too, and a job that only wakes for markdown would never see them.
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The optical vocabulary is seeded in
      # .vale/styles/spelling-exceptions.txt so this does not become a game of
      # adding one word per failed run.
      #
      # The path list mirrors VALE_PATHS in tasks.py, and
      # test_the_ci_vale_job_reads_the_same_paths_invoke_lints reads this line
      # and fails when the two disagree.
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: '["README.md", "docs/docs", "src", "tests", "scripts", "tasks.py", "checks", "generators", "transforms", "queries", "schemas", "objects", "menus", "demo"]'
          fail_on_error: true
          reporter: github-pr-check

  docker-build:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The shared package reaching the worker is the assumption every check,
      # generator and transform rests on. Prove it on every change.
      #
      # No --build-arg. The Dockerfile's own `ARG INFRAHUB_BASE_VERSION=` default
      # is the version, and passing the same literal here was a seventh
      # declaration that `update-infrahub.yml` did not rewrite and
      # `tests/unit/test_pins.py` did not guard: a bump moved the other six and
      # left this job building the release it had just moved off, silently and
      # green. `test_pins.py` now fails if a version literal returns here.
      - name: Build the custom Infrahub image
        run: docker build -t infrahub-demo-otn:ci .
      - name: Verify the worker can import the shared package
        run: |
          docker run --rm --entrypoint /.venv/bin/python infrahub-demo-otn:ci -c "
          from infrahub_demo_otn.units import db_to_mdb
          assert db_to_mdb(0.21) == 210
          print('shared package importable in the worker image')
          "

  schema-validate:
    if: needs.files-changed.outputs.schema == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      # Formatting is a gate so schema diffs stay reviewable instead of
      # reshuffling keys on every edit.
      - run: uv run infrahubctl schema format --check schemas/
      # NOTE: there is no `infrahubctl schema validate`. The subcommands are
      # load / check / export / list / show / format, and `check` needs a
      # running server. Semantic schema validation therefore happens in the
      # integration-test job, not here. This job is the offline gate only.
      - name: Schema files are well-formed YAML
        run: uv run python -c "import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('schemas').rglob('*.yml')]"

  integration-test:
    # A demo whose scenarios are not executed by CI is a demo that is already
    # broken and nobody has noticed.
    #
    # It runs only when the lint jobs pass, because starting Infrahub and loading
    # 1265 objects to discover a syntax error is an expensive way to find one.
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.files-changed.outputs.python == 'true' || needs.files-changed.outputs.schema == 'true')
    needs: ["files-changed", "python-lint", "yaml-lint", "schema-validate", "budget-unit-tests"]
    # Not ubuntu-latest, after four cores were given a fair trial and failed it.
    #
    # The stack came up there in the end, but only at the edge of what the
    # machine could hold, and the suite failed four times in four different
    # places: the task workers timing out at 60s, the server missing a 110s
    # healthcheck, checks starved by HTTP 429 until they blew Prefect's
    # per-task budget, and the load balancer answering 502 and HTML 503 to
    # calls that expected JSON. Each was a real defect and each was fixed, and
    # the next run found the next one, because they are one condition wearing
    # different faces: no spare capacity. infrahub-demo-dc runs the same stack
    # here for the same reason.
    #
    # This repository has to be in the `huge-runners` group's selected
    # repositories. A job pointed at a group it cannot reach queues rather than
    # failing, so if this sits in `queued` and nothing picks it up, that is the
    # cause, and `ubuntu-latest` plus the guards in tests/integration/ is the
    # configuration to fall back to.
    runs-on:
      group: "huge-runners"
    env:
      # infrahub-demo-dc sets this on the same runner group. The previous run
      # wrote a 19 MB job log, most of it container chatter nobody reads.
      INFRAHUB_TESTING_LOG_LEVEL: INFO
    # The figure is the sum of the ceilings the suite itself allows, not a
    # guess. Repository sync 900s, definitions 600s and the proposed-change
    # pipeline 1800s is 55 minutes, and setup plus the dataset load has measured
    # around 20 on top. A passing run comes in far under that, because every one
    # of those waits returns as soon as its condition holds. A job that dies on
    # its own timeout reports nothing useful, so this stays above the sum rather
    # than near it, and a job with no timeout at all hangs for six hours.
    #
    # Measured wall clock, all on this runner group: 54m29s, then 37 or so once
    # the bare `demo-clean` came out of the suite. That one test was 1003
    # seconds of it, and almost none of that was deletion. See the docstring on
    # test_demo_clean_with_a_branch_removes_only_that_one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Every scenario test spawns `uv run invoke`, which spawns `infrahubctl`,
      # so this job forks a few hundred processes over an hour with pytest as
      # pid 1. infrahub-demo-dc installs tini here for the same reason and runs
      # its suite under it.
      - name: Install tini
        run: "apt-get update && apt-get install -y tini"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      # The stack runs this image, not the vanilla one, because every check,
      # transform and generator imports `infrahub_demo_otn` and the vanilla
      # image has no such module. `tests/integration/conftest.py` points
      # testcontainers at it and fails naming this step when it is absent.
      #
      # Build it here rather than reusing the docker-build job's image: a stale
      # local image is exactly how the repository import failed the first time
      # it was attempted, with `No module named 'infrahub_demo_otn.impact'`, and
      # that job's import probe only covers `infrahub_demo_otn.units`.
      - name: Build the image the testcontainers stack runs
        run: uv run invoke build
      # The compose project lives in pytest's temp directory and the stack bind
      # mounts files out of it: haproxy.cfg, prometheus.yml, ./repos, ./backups.
      # A bind mount is resolved by the Docker daemon, which here is the host's,
      # while pytest's default temp root is inside the runner container. The
      # host has no /tmp/pytest-of-root, so Docker creates a directory at each
      # path instead, and haproxy given a directory where its config should be
      # prints its usage text and exits. `up --wait` then fails at about ninety
      # seconds with nothing in any container log to say why.
      #
      # /var/lib/github/ghrunner_N/_temp is the same path in both places.
      # infrahub-demo-dc derives it the same way and for the same reason.
      #
      # Skipped rather than guessed when the runner name carries no ghrunnerN
      # token, which is what a hosted runner looks like: there the default temp
      # root is already correct, and the derivation would produce
      # /var/lib/github//_temp, a path that exists nowhere and fails the same
      # way this step exists to prevent.
      - name: Point pytest at a temp root the Docker host shares
        env:
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          set -euo pipefail
          if RUNNER_ID=$(echo "${RUNNER_LABEL}" | grep -o 'ghrunner[0-9]\+'); then
            echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_ID/ghrunner/ghrunner_}/_temp" >> "$GITHUB_ENV"
            echo "Runner '${RUNNER_LABEL}': temp root set for shared-daemon bind mounts."
          else
            echo "::notice::Runner '${RUNNER_LABEL}' carries no ghrunner<N> token; leaving pytest's default temp root."
          fi
      # tests/integration/conftest.py sets neither the task worker nor the
      # gunicorn count, so the stack takes its packaged size whatever this
      # machine turns out to be. Print what it reports, so a run that starves
      # says what it had rather than leaving the next reader to infer the
      # runner from its name.
      - name: Report what this runner has
        run: |
          echo "runner:  ${{ runner.name }}"
          echo "cores:   $(nproc)"
          free -g || true
      # infrahub-testcontainers is pinned to the same version docker-compose
      # runs, so this exercises the version the demo ships against rather than
      # whatever is newest. Named without the number on purpose: a version
      # literal in this file is what test_pins.py now refuses.
      #
      # Through the task, not a bare pytest: `tasks.py::TIERS` is what maps a
      # tier to a selection, and a second copy of that mapping here is a second
      # thing to keep in step. `tests/unit/test_task_commands.py` reads the tier
      # out of this file and checks it against that table.
      - name: Load the dataset, register the repository, run the pipeline
        env:
          TIER: ${{ needs.files-changed.outputs.tier }}
        run: exec tini -s -g -- uv run invoke test-integration --tier="${TIER}"

  documentation:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "python-lint", "yaml-lint", "markdown-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
