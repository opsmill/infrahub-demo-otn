---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - "dependencies"
    groups:
      all:
        # infrahub-sdk is excluded here and grouped alone below. An SDK bump
        # can change traverse_paths signatures, so it gets a reviewable PR of
        # its own rather than being buried in a bundle.
        #
        # `exclude-patterns`, not a regex lookahead in `patterns`. Dependabot
        # matches these as globs, so `^(?!infrahub-sdk$).*` matched nothing and
        # the group silently covered no package: #2 and #3 arrived as separate
        # pull requests where one grouped request was intended.
        #
        # The trailing `*` is not decoration. Dependabot names this dependency
        # by its specifier including extras, `infrahub-sdk[all,ctl]`, so a bare
        # `infrahub-sdk` matches neither the exclusion here nor the group below.
        # #9 arrived titled "Bump infrahub-sdk[all,ctl] ... in the all group",
        # which is the bundle both rules exist to keep it out of.
        patterns:
          - "*"
        exclude-patterns:
          - "infrahub-sdk*"
          - "infrahub-testcontainers*"
      infrahub-sdk:
        patterns:
          - "infrahub-sdk*"
      # infrahub-testcontainers is the Infrahub version. Nothing else declares
      # it: `src/infrahub_demo_otn/baseversion.py` derives the tag the image is
      # built from, the tag Compose runs and the tag the test stack starts from
      # whichever release installs here, so this bump is the whole bump and
      # Dependabot can make it.
      #
      # Its own group, not part of `all`. A bump touches `tasks.py`, `Dockerfile`
      # and `pyproject.toml` by implication, so `.github/file-filters.yml` puts
      # it in `demo_all` and it runs the full integration tier: the widest blast
      # radius of any change here, which should not arrive in a request titled
      # after a linter.
      infrahub-testcontainers:
        patterns:
          - "infrahub-testcontainers*"

    # `rich` and `ruff` are capped transitively by infrahub-sdk, so Dependabot
    # cannot move them and fails the whole uv job trying. It reports both as
    # `dependency_file_not_resolvable` on every run:
    #
    #   rich  infrahub-sdk[all] requires rich>=12,<14; Dependabot offers 15.0.0
    #   ruff  ariadne-codegen==0.18.0, via infrahub-sdk[all], requires
    #         ruff>=0.15.0,<0.16.0; Dependabot offers 0.16.6
    #
    # Our own specifiers are floors, and a floor cannot lead the cap above it.
    # The lock already resolves each to the newest release the cap allows, so
    # what these bumps would move is a lower bound nothing reads, at the price of
    # a red job every Monday.
    #
    # Ignored by name and not by version range on purpose. `versions: [">=14"]`
    # would state the cap a second time, in a file that does not move when
    # infrahub-sdk relaxes it, which is the stale-declaration shape #27 removed.
    #
    # The cost is that neither is offered again once the caps do lift. Drop the
    # rule that no longer applies when bumping infrahub-sdk past a release that
    # widens either range.
    ignore:
      - dependency-name: "rich"
      - dependency-name: "ruff"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: main
    labels:
      - "dependencies"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: main
    labels:
      - "dependencies"
